<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEAGUE UV — Victory Unite (DFMM)</title>
<meta name="theme-color" content="#080A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icone-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&amp;display=swap">
<style id="app-style">/* VOICE work, with esport energy: the league's official office
   IDEA the end-of-match scoreboard of Delta Force, worn as a tactical HUD
   PICTURE the 11-distinction scoreboard beside the official DFMM logo
   COLOUR ground #080A0A, ink #FFFFFF, green #35D66F leads, red #E53935 for alerts, helmet greys
   TYPE Exo 2 italic 800 (from the logo lettering) + system sans for text
   LAYOUT laptop: logo and title left, scoreboard right; phone: logo, title, scoreboard stacked */
:root{color-scheme:dark;--bg:#080A0A;--bg2:#0B100E;--panel:#0F1513;--panel2:#141C19;--line:#1E2924;--line2:#2C3B34;--ink:#FFFFFF;--mute:#AAB5AF;--dim:#7B8781;--green:#35D66F;--green2:#27B15A;--greenbg:rgba(53,214,111,.10);--red:#E53935;--redbg:rgba(229,57,53,.13);--amber:#F2A93B;--amberbg:rgba(242,169,59,.13);--steel:#8C9692;--display:"Exo 2","Arial Narrow",system-ui,sans-serif;--text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);--plate:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--text);overflow-x:clip;-webkit-text-size-adjust:100%}
body.modal-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-style:italic;font-weight:800;line-height:1.05;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(34px,6vw,52px)}
h2{font-size:clamp(26px,3.6vw,34px)}
h3{font-size:20px}
p{margin:.5em 0}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto}
.band{padding-block:clamp(26px,4vw,56px);padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
.band.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mute{color:var(--mute)}
.dim{color:var(--dim)}
.small{font-size:14px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* En-tête */
.top{position:sticky;top:0;z-index:20;background:rgba(8,10,10,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(4vw,16px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:38px;height:auto;mix-blend-mode:lighten}
.brand b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;line-height:1;color:var(--ink)}
.brand small{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.saison-chip{font-size:13px;color:var(--mute);border:1px solid var(--line2);padding:4px 10px;white-space:nowrap;clip-path:var(--plate)}
.saison-chip b{color:var(--green);font-weight:600}
@media(max-width:520px){.brand small{display:none}.brand b{font-size:19px}.saison-chip{font-size:12px;padding:3px 8px}.nav a{font-size:14px;padding:8px 10px}.seg button{padding:6px 11px;min-height:38px}}
.nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(4vw,16px) 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;padding:8px 12px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-bottom-color:var(--green)}
.nav a.adm{color:var(--green)}
.banner{margin:12px max(4vw,16px) 0;padding:10px 14px;border:1px solid var(--line2);background:var(--panel);color:var(--mute);font-size:14px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:0;background:var(--green);color:#04110A;font-weight:700;text-decoration:none;cursor:pointer;clip-path:var(--cut);font-size:15px}
.btn:hover{background:#4BE583}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);clip-path:none}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--green);color:var(--green)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#F04B47}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lien{background:none;border:0;padding:0;color:var(--green);cursor:pointer;text-decoration:underline;font-size:inherit}

/* Accueil */
.hero{background:radial-gradient(1200px 500px at 15% 0%,rgba(53,214,111,.08),transparent 60%),var(--bg)}
.hero-grid{display:grid;gap:22px;max-width:1240px;margin:0 auto;grid-template-areas:"id" "board" "more"}
.hero-id{grid-area:id;display:flex;align-items:center;gap:16px}
.hero-more{grid-area:more;display:grid;gap:18px;align-content:start}
.board{grid-area:board}
.logo-full{width:132px;height:auto;mix-blend-mode:lighten;flex:none}
.hero-t{display:grid;gap:6px}
.hero-id .sous{font-family:var(--display);font-style:italic;font-weight:700;color:var(--green);font-size:18px;margin:0}
.lead{font-size:17px;color:var(--mute);max-width:60ch;margin:0}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.facts li{background:var(--panel);padding:12px 14px}
.facts b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;color:var(--green);line-height:1.1}
.facts span{font-size:14px;color:var(--mute)}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
@media(min-width:900px){
  .hero-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-areas:"id board" "more board";grid-template-rows:auto 1fr;gap:26px 44px;align-items:start}
  .hero-id{display:grid;gap:18px}
  .logo-full{width:250px}
  .hero-id .sous{font-size:20px}
}

/* Tableau des distinctions (scoreboard) */
.board{background:linear-gradient(180deg,#0E1512,#0A0F0D);border:1px solid var(--line2);position:relative}
.board::before,.board::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--green);pointer-events:none}
.board::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.board::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.board-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.board-h h2{font-size:24px}
.board-h p{margin:0;font-size:13px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;clip-path:var(--plate);background:var(--line2);color:var(--ink);white-space:nowrap}
.badge.g{background:var(--green);color:#04110A}
.badge.r{background:var(--red);color:#fff}
.badge.a{background:var(--amber);color:#1D1302}
.badge.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--mute);clip-path:none}
.grp{padding:6px 16px 2px;font-size:13px;color:var(--green);font-weight:700;border-top:1px solid var(--line);background:rgba(53,214,111,.04)}
.grp:first-of-type{border-top:0}
.br{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.br .cat{font-weight:700;font-size:14px;line-height:1.2}
.br .cat small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.br .who{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.br .who small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.br .val{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;color:var(--green)}
.br.vide .who,.br.vide .val{color:var(--dim);font-weight:400;font-family:var(--text);font-style:normal;font-size:14px}
.board-f{padding:10px 16px;border-top:1px solid var(--line2);font-size:13px;color:var(--mute)}

/* Sections */
.sec-head{display:grid;gap:8px;margin-bottom:22px;max-width:900px}
.sec-head p{color:var(--mute);margin:0}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.step{background:var(--panel);border:1px solid var(--line);padding:16px}
.step h3{font-size:19px;margin-bottom:6px}
.step .n{font-family:var(--display);font-style:italic;font-weight:800;color:var(--green);font-size:15px}
.step p{margin:0;color:var(--mute);font-size:15px}
.dist{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dist .step ul{margin:8px 0 0;padding-left:18px;color:var(--ink)}
.dist .step li{margin:3px 0}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.panel h3{margin-bottom:8px}
.note{border-left:3px solid var(--green);background:var(--greenbg);padding:10px 14px;margin:14px 0;font-size:15px}
.note.r{border-left-color:var(--red);background:var(--redbg)}
.note.a{border-left-color:var(--amber);background:var(--amberbg)}
.cols2{display:grid;gap:14px}
@media(min-width:820px){.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Tableaux */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
tr.lead1 td{background:var(--greenbg)}
td.r{text-align:right}
@media(max-width:600px){table{font-size:14px}th,td{padding:7px 6px}}

/* Classements publics */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.seg button{border:1px solid var(--line2);background:transparent;padding:8px 14px;cursor:pointer;color:var(--mute);font-weight:600;min-height:40px}
.seg button.on{background:var(--green);border-color:var(--green);color:#04110A}
.cl-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.cl-card{background:var(--panel);border:1px solid var(--line)}
.cl-card header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line2)}
.cl-card h3{font-size:19px}
.cl-card .def{font-size:13px;color:var(--mute);margin:2px 0 0}
.cl-card table{font-size:14px}
.rk{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 4px;font-family:var(--display);font-style:italic;font-weight:800;font-size:14px;background:var(--line2);clip-path:var(--plate)}
tr.lead1 .rk{background:var(--green);color:#04110A}
.vide-cl{padding:28px 16px;text-align:center;color:var(--mute)}

/* Règlement */
.regl{display:grid;gap:24px;max-width:1240px;margin:0 auto}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:6px 10px;font-size:14px;cursor:pointer;text-align:left}
.toc button:hover{color:var(--ink);border-color:var(--green)}
@media(min-width:1000px){.regl{grid-template-columns:250px minmax(0,1fr)}.toc{position:sticky;top:110px;flex-direction:column;align-self:start}.toc button{border:0;border-left:2px solid var(--line);background:none}}
.chap{scroll-margin-top:110px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:24px}
.chap h2{font-size:26px;margin-bottom:10px}
.chap h2 .cn{color:var(--green);margin-right:8px}
.chap h3{font-size:18px;margin:16px 0 6px}
.chap ul,.chap ol{padding-left:20px;margin:6px 0}
.chap li{margin:4px 0}
.chap p,.chap li{max-width:75ch}
.chg{font-size:12px;font-weight:700;color:#04110A;background:var(--green);padding:1px 6px;margin-left:6px;vertical-align:2px;clip-path:var(--plate);white-space:nowrap}

/* Processus */
.flows{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.flow{background:var(--panel);border:1px solid var(--line);padding:16px}
.flow h3{margin-bottom:4px}
.flow > p{color:var(--mute);margin:0 0 10px;font-size:15px}
.rail{list-style:none;margin:0;padding:0;position:relative}
.rail li{position:relative;padding:0 0 12px 30px}
.rail li::before{content:"";position:absolute;left:7px;top:8px;width:10px;height:10px;background:var(--green);clip-path:var(--plate)}
.rail li::after{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line2)}
.rail li:last-child::after{display:none}
.rail li b{display:block}
.rail li span{color:var(--mute);font-size:15px}
.rail li.stop::before{background:var(--red)}

/* Formulaires */
label.lab{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px;font-weight:600}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=datetime-local],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;min-height:44px;background:#090D0C;border:1px solid var(--line2);padding:9px 11px;font-size:16px;border-radius:0;color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix label{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:9px 12px;cursor:pointer;min-height:44px}
.choix label:has(input:checked){border-color:var(--green);background:var(--greenbg)}
.coche{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.coche input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
input[type=radio]{accent-color:var(--green);width:18px;height:18px}
.grid-f{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.err{color:#FF8A86;font-size:14px;margin-top:4px}
.types{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));border:0;padding:0;margin:0 0 10px}
.types label{display:block;border:1px solid var(--line2);padding:10px 12px;cursor:pointer;background:var(--panel);line-height:1.3}
.types label b{display:block}
.types label span{font-size:13px;color:var(--mute)}
.types input{position:absolute;opacity:0;pointer-events:none}
.types label:has(input:checked){border-color:var(--green);background:var(--greenbg)}
.types label:has(input:focus-visible){outline:2px solid var(--ink)}
.msg-out{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;min-height:220px}

/* Administration */
.adm-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.adm-tabs a{flex:none;text-decoration:none;color:var(--mute);border:1px solid var(--line2);padding:7px 12px;font-size:14px;font-weight:600}
.adm-tabs a.on{background:var(--green);border-color:var(--green);color:#04110A}
.adm-tabs a .cpt{display:inline-block;min-width:20px;margin-left:6px;padding:0 5px;background:var(--red);color:#fff;font-size:12px;text-align:center}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:12px}
.kpi b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;color:var(--green);line-height:1.1}
.kpi span{font-size:13px;color:var(--mute)}
.taches{list-style:none;margin:0;padding:0}
.taches li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-l{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-bottom:10px}
.card-l .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.card-l .t b{font-size:17px}
.chk{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.chk li{padding:3px 0 3px 24px;position:relative}
.chk li::before{position:absolute;left:0;font-weight:800}
.chk li.b{color:#FF8A86}.chk li.b::before{content:"✕";color:var(--red)}
.chk li.w{color:#FFD08A}.chk li.w::before{content:"!";color:var(--amber);left:6px}
.chk li.o{color:var(--mute)}.chk li.o::before{content:"✓";color:var(--green)}
.kv{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 12px;font-size:15px;margin:6px 0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;overflow-wrap:anywhere}
.lignes-t input,.lignes-t select{min-height:38px;padding:5px 6px;font-size:16px}
.lignes-t input[type=number]{width:74px}
.lignes-t td{padding:4px 4px;vertical-align:middle}
.lignes-t .ps{min-width:150px}
.lignes-t select[data-f=faction]{min-width:98px}
.res{font-size:13px;white-space:nowrap}
.res.auto{color:var(--green)}
.res.aid{color:var(--amber);font-weight:700}
.res.ni{color:var(--dim)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs a img{width:90px;height:90px;object-fit:cover;border:1px solid var(--line2)}
.ctrl-box{position:sticky;bottom:0;background:var(--panel2);border:1px solid var(--line2);padding:10px 12px;margin-top:12px;max-height:40vh;overflow:auto}

/* Modale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.modal-c{background:var(--bg2);border:1px solid var(--line2);width:min(820px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal.large .modal-c{width:min(1180px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.modal-h h3{font-size:20px}
.modal-x{background:none;border:0;color:var(--mute);font-size:28px;line-height:1;cursor:pointer;min-width:44px;min-height:44px}
.modal-b{padding:4px 16px 16px;overflow:auto}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line2)}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--green);padding:10px 16px;max-width:min(92vw,560px);font-size:15px}
.toast.err{border-color:var(--red)}

.foot{border-top:1px solid var(--line);padding:22px max(4vw,16px) 30px;color:var(--dim);font-size:14px;display:grid;gap:6px}
.foot b{color:var(--mute)}

/* Lot socle : connexion et version de test */
input[type=password]{width:100%;min-height:44px;background:#090D0C;border:1px solid var(--line2);padding:9px 11px;font-size:16px;border-radius:0;color:var(--ink)}
.banner.test{border-color:var(--red);background:var(--redbg);color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><header class="top">

          <h1>LEAGUE UV</h1>
          <p class="sous">Victory Unite, saison après saison</p>

      <div class="hero-more">
        <p class="lead">La ligue communautaire et individuelle des joueurs malgaches de Delta Force Mobile. Chaque match validé compte, et chaque contribution peut être reconnue sur la saison.</p>
        <ul class="facts">
          <li><b>Mer. et sam.</b><span>matchs officiels à 16 h</span></li>
          <li><b>14 jours</b><span>entre deux classements provisoires</span></li>
          <li><b>11</b><span>distinctions par saison</span></li>
          <li><b>8</b><span>statistiques suivies par match</span></li>
        </ul>

  <div class="band alt">
    <div class="wrap">
      <div class="sec-head"><h2>Comment ça marche</h2><p>La ligue suit vos performances individuelles sur toute la saison, à partir des captures de fin de match.</p></div>
      <div class="steps">
        <div class="step"><span class="n">Étape 1</span><h3>S’inscrire</h3><p>Formulaire d’inscription, puis vérification par l’organisation. Vous recevez un matricule permanent DFMM-n.</p></div>
        <div class="step"><span class="n">Étape 2</span><h3>Jouer</h3><p>Matchs officiels le mercredi et le samedi à 16 h, ou matchs libres déclarés à l’avance.</p></div>
        <div class="step"><span class="n">Étape 3</span><h3>Prouver</h3><p>La capture du résultat de fin de match est contrôlée, puis validée manuellement par l’organisation.</p></div>
        <div class="step"><span class="n">Étape 4</span><h3>Être classé</h3><p>Classement provisoire un dimanche sur deux, classement final après l’audit de fin de saison.</p></div>
      </div>
    </div>
  </div>

  <div class="band">
    <div class="wrap">
      <div class="sec-head"><h2>Les 11 distinctions</h2><p>Plusieurs façons d’être reconnu : l’assiduité, la qualité et la capacité à rester en vie tout en contribuant.</p></div>
      <div class="dist">
        <div class="step"><span class="n">5 titres</span><h3>MOST, le total de la saison</h3><p>Récompense l’assiduité et la persévérance : chacun peut gagner en jouant régulièrement.</p><ul><li>MOST Eliminator</li><li>MOST Medic</li><li>MOST Engineer</li><li>MOST Tactician</li><li>MOST Objective</li></ul></div>
        <div class="step"><span class="n">5 titres</span><h3>BEST, la moyenne par match</h3><p>Récompense la qualité, à condition d’avoir joué au moins le nombre médian de matchs.</p><ul><li>BEST Eliminator</li><li>BEST Medic</li><li>BEST Engineer</li><li>BEST Tactician</li><li>BEST Objective</li></ul></div>
        <div class="step"><span class="n">1 titre</span><h3>BEST Survivor</h3><p>La moyenne de morts par match la plus faible, avec un minimum de matchs et un score moyen au moins égal au premier quartile.</p></div>
      </div>
    </div>
  </div>

        <h2>Nos principes</h2>
        <ul class="chk" style="font-size:16px;margin-top:14px">
          <li class="o">Équité : les mêmes règles de calcul pour tous, publiées à l’avance.</li>
          <li class="o">Transparence : classements provisoires réguliers et droit de réclamation sous 48 h.</li>
          <li class="o">Intégrité : un seul matricule par personne, un seul compte actif, des preuves vérifiées.</li>
          <li class="o">Aucun ex æquo récompensé, aucun tirage au sort, aucune attribution arbitraire.</li>
        </ul>
        <p class="mute small">La LEAGUE UV est une compétition communautaire indépendante de DFMM. Elle n’est ni organisée ni certifiée par l’éditeur du jeu.</p>
      </div>
    </div>
  </div>
</section>

        <h1>Règlement de la LEAGUE UV</h1>
        <p>Version en ligne, à jour des décisions de novembre 2026. Elle remplace les points correspondants du guide PDF. Les informations propres à chaque saison (dates, lots, contacts) sont annoncées séparément.</p>

      <div>
        <article class="chap" id="r-principes">
          <h2>Principes</h2>
          <p>La LEAGUE UV est une compétition communautaire individuelle et saisonnière de DFMM (DELTA FORCE MOBILE MADAGASCAR), organisée autour du mode Victory Unite (Warfare) de Delta Force Mobile Global. Elle reconnaît les performances sur la durée, dans un cadre vérifiable et équitable.</p>
          <ul>
            <li>Une personne = un matricule = un seul compte actif à la fois.</li>
            <li>8 statistiques suivies, 11 distinctions, 1 lot matériel au maximum par joueur.</li>
            <li>Le <b>lauréat sportif</b> garde le titre de sa catégorie. Le <b>bénéficiaire matériel</b> reçoit éventuellement le lot, selon l’ordre de priorité et la règle d’un seul lot par joueur.</li>
            <li>Aucun ex æquo récompensé, aucun tirage au sort, aucune attribution arbitraire.</li>
            <li>Initiative indépendante : ce règlement n’est pas celui de l’éditeur du jeu.</li>
          </ul>
        </article>

        <article class="chap" id="r-elig">
          <h2><span class="cn">1</span>Éligibilité et inscription</h2>
          <h3>Conditions</h3>
          <ul>
            <li>Être de nationalité malgache ou d’origine malgache (déclaration à l’inscription, vérifiée par l’organisation lors de l’approbation).</li>
            <li>Comprendre le malgache : <b>critère essentiel</b>.<span class="chg">Mis à jour</span></li>
            <li>Parler le malgache : information demandée, non bloquante (le créole est accepté).</li>
            <li>Un joueur malgache vivant à l’étranger peut participer s’il remplit ces critères. Résider à Madagascar ne suffit pas à lui seul.</li>
          </ul>
          <div class="scroll"><table>
            <thead><tr><th>Situation</th><th>Décision de principe</th></tr></thead>
            <tbody>
              <tr><td>Joueur malgache vivant à Madagascar, qui comprend le malgache</td><td>Admissible, sous réserve des contrôles</td></tr>
              <tr><td>Joueur malgache vivant à l’étranger, qui comprend le malgache</td><td>Admissible, sous réserve des contrôles</td></tr>
              <tr><td>Joueur non malgache résidant à Madagascar</td><td>Non admissible sur le seul critère de résidence</td></tr>
              <tr><td>Joueur d’origine malgache qui ne comprend pas le malgache</td><td>Ne remplit pas le critère linguistique</td></tr>
            </tbody>
          </table></div>
          <h3>Informations demandées</h3>
          <p>Nom et prénom réels, nom de gamer dans la communauté, e-mail (obligatoire), date de naissance, genre (homme, femme ou préfère ne pas le dire), lien Facebook, clan (facultatif), pseudo exact en jeu, UID Delta Force, capture du profil de jeu montrant le pseudo et l’UID, lieu de résidence (à Madagascar : province puis ville principale ou périphérie ; à l’étranger : pays), compréhension et pratique du malgache, déclaration de nationalité ou d’origine malgache, acceptation des règlements DFMM et LEAGUE UV, du traitement des données et de l’approbation de l’inscription.</p>
          <h3>Parcours</h3>
          <p>Envoi des informations, vérification (dossier complet, UID unique, pseudo et UID contrôlés sur la capture du profil, critères d’éligibilité), décision de l’organisation, attribution du matricule et enregistrement du compte, puis message de confirmation. Chaque inscription est validée manuellement. L’inscription donne accès aux activités réservées aux membres ; certaines activités restent publiques.</p>
        </article>

        <article class="chap" id="r-mat">
          <h2><span class="cn">2</span>Matricule, comptes et pseudo</h2>
          <h3>Matricule</h3>
          <ul>
            <li>Format DFMM-1, DFMM-2, DFMM-3… attribué automatiquement à l’approbation.</li>
            <li>Permanent : il suit la personne pendant toutes les saisons. Un numéro n’est jamais réutilisé, même après un retrait ou une exclusion.</li>
          </ul>
          <h3>Comptes de jeu</h3>
          <ul>
            <li>Au maximum <b>2 comptes</b> Delta Force enregistrés par matricule, et <b>un seul actif</b> à la fois. Seul le compte actif est comptabilisé.<span class="chg">Mis à jour</span></li>
            <li>Ajouter un 2e compte : demande avec le pseudo, l’UID, une capture du profil et un motif. Contrôles : 2 comptes au maximum, UID inconnu des autres membres. Le 2e compte peut devenir actif tout de suite.</li>
            <li>Changer de compte actif : demande avec un motif court. Il faut au moins <b>7 jours</b> entre deux changements.</li>
            <li>Compte perdu ou inaccessible : il est marqué « Remplacé » définitivement. Les statistiques restent attachées au matricule.</li>
            <li>Ajout et changement de compte actif passent par l’accord de l’organisation. Un compte non reconnu n’est pas comptabilisé.</li>
            <li>Un changement de compte ne peut jamais servir à éviter une sanction, une restriction ou un mauvais résultat.</li>
          </ul>
          <h3>Pseudo</h3>
          <ul>
            <li>Un changement de pseudo est une simple <b>déclaration</b>, sans approbation, à faire avant la participation suivante.<span class="chg">Mis à jour</span></li>
            <li>L’historique des pseudos est conservé. Le pseudo lu sur une capture est rattaché au bon compte selon la date du match.</li>
          </ul>
        </article>

        <article class="chap" id="r-statut">
          <h2><span class="cn">3</span>Statut de membre et périodes</h2>
          <ul>
            <li><b>Actif</b> : membre approuvé, ses matchs comptent.</li>
            <li><b>Suspendu</b> : sanction temporaire, avec une date de fin. Il reste membre, mais ses matchs ne comptent pas pendant la suspension.</li>
            <li><b>Retiré</b> : départ volontaire, accepté par l’organisation.</li>
            <li><b>Exclu</b> : sanction définitive, pour des faits graves ou répétés.</li>
          </ul>
          <p>Un membre ne change jamais lui-même son statut : il adresse une demande à l’organisation, qui l’accepte ou la refuse.</p>
          <h3>Règle de comptabilisation</h3>
          <p>Un match compte pour un joueur seulement s’il s’est terminé pendant une période où le membre et son compte étaient actifs. Les matchs joués avant l’approbation, ou pendant un retrait, une suspension ou une exclusion, ne comptent pas.<span class="chg">Nouveau</span></p>
          <h3>Retrait et réintégration</h3>
          <ul>
            <li>Demande de retrait avec motif facultatif. Si elle est acceptée, la période active se ferme, les comptes deviennent inactifs et les autres demandes en cours sont annulées.</li>
            <li>Le matricule, les statistiques et le pseudo sont conservés, mais un membre retiré n’apparaît plus dans les classements et ne reçoit aucun lot.</li>
            <li>Réintégration possible à tout moment avec l’accord de l’organisation : même matricule et même historique, nouvelle période à partir de la date d’accord.</li>
          </ul>
          <h3>Effacement des données</h3>
          <p>Sur demande, les informations personnelles (e-mail, date de naissance, nom réel, lien Facebook, etc.) sont effacées. Le matricule, les statistiques et le pseudo de jeu sont conservés, et les apparitions passées dans les classements et résultats officiels restent publiques avec le pseudo.</p>
        </article>

        <article class="chap" id="r-matchs">
          <h2><span class="cn">4</span>Matchs officiels et matchs libres</h2>
          <p>Tous les matchs valides ont la même valeur pour les classements. Chaque match garde une étiquette « officiel » ou « libre ».</p>
          <h3>Matchs officiels</h3>
          <ul>
            <li>Organisés par DFMM le mercredi et le samedi à 16 h, un match par session.</li>
            <li>Salon personnalisé du mode Victory Unite, rejoint par code. Chat écrit uniquement, sans micro.</li>
            <li>Escouades de 4 avec un capitaine, 5 escouades au maximum par faction. Le commandant et les capitaines sont désignés par l’organisation, sans vote. La carte est choisie dans le salon. Aucune condition de grade.</li>
            <li>Si le salon est complet, les places sont attribuées dans l’ordre d’arrivée.</li>
          </ul>
          <h3>Matchs libres</h3>
          <ul>
            <li>Organisés par les joueurs, avec <b>déclaration préalable obligatoire</b> : demande de créneau (date, heure, motif).<span class="chg">Mis à jour</span></li>
            <li>L’organisation accepte ou refuse, et indique si elle participe comme témoin ou si elle confie le match aux joueurs.</li>
            <li>Un seul match est comptabilisé par créneau. Seule une capture rattachée à un créneau accepté est prise en compte.</li>
            <li>Un organisateur et un responsable par faction. Chaque responsable envoie la capture du résultat, l’organisateur peut en envoyer une troisième. Les captures doivent concorder.</li>
            <li>La capture doit être envoyée au plus <b>30 minutes</b> après la fin du match. L’heure de fin affichée sur la capture fait foi.</li>
          </ul>
        </article>

        <article class="chap" id="r-valid">
          <h2><span class="cn">5</span>Validité d’un match et preuves</h2>
          <h3>Conditions de validité</h3>
          <ul>
            <li>Au moins <b>16 participants</b> (8 contre 8).<span class="chg">Mis à jour</span></li>
            <li>Factions HAAVK et GTI équilibrées : même effectif ou un joueur d’écart au maximum, compté sur tous les participants de la capture (inscrits ou non). Au-delà, le match est invalidé automatiquement.</li>
            <li>Au moins <b>30 % de membres inscrits</b> parmi les participants, arrondi à l’entier supérieur (16 participants : 5 membres au minimum).<span class="chg">Nouveau</span></li>
            <li>Les joueurs non inscrits ne bloquent pas le match, mais seuls les membres inscrits reçoivent des points.</li>
            <li>Un joueur ne participe qu’une seule fois au même match, y compris avec deux comptes.</li>
            <li>Le match doit se terminer pendant la saison, avant les 7 derniers jours réservés à l’audit.</li>
          </ul>
          <h3>Preuves et validation</h3>
          <ul>
            <li>La preuve principale est la capture du résultat de fin de match : carte, mode, date et heure de fin, pseudos et 8 statistiques. Au-delà de 8 joueurs par faction, il faut deux captures (haut, puis bas de la liste).</li>
            <li>Contrôles automatiques : valeurs manquantes, négatives ou en double, effectif, équilibre des factions, part de membres inscrits et délai d’envoi.</li>
            <li>Pseudo ambigu ou incertain : la ligne est marquée « à identifier » et l’organisation choisit le bon compte. Le match ne compte pas tant que ce n’est pas fait.</li>
            <li>Chaque match est vu et confirmé par l’organisation avant de compter. Une déclaration orale ou une capture isolée et contestée ne suffit pas.</li>
            <li>Une déconnexion ou un abandon n’efface pas automatiquement les statistiques déjà acquises : la validité générale du match est examinée.</li>
            <li>Un match invalidé est retiré pour tous ses participants, sans sanction individuelle automatique.</li>
            <li>La date d’une capture peut être falsifiée : l’organisation peut refuser un match suspect.</li>
          </ul>
        </article>

        <article class="chap" id="r-stats">
          <h2><span class="cn">6</span>Statistiques et distinctions</h2>
          <div class="scroll"><table>
            <thead><tr><th>N°</th><th>Statistique</th><th>Utilisation</th></tr></thead>
            <tbody>
              <tr><td>1</td><td>Score du match</td><td>Départages et conditions de BEST Survivor</td></tr>
              <tr><td>2</td><td>Éliminations</td><td>Catégorie Eliminator</td></tr>
              <tr><td>3</td><td>Morts</td><td>Statistique centrale de BEST Survivor</td></tr>
              <tr><td>4</td><td>Assistances</td><td>Suivie, sans distinction propre</td></tr>
              <tr><td>5</td><td>Contribution médicale</td><td>Catégorie Medic</td></tr>
              <tr><td>6</td><td>Contribution ingénieur</td><td>Catégorie Engineer</td></tr>
              <tr><td>7</td><td>Contribution aux objectifs</td><td>Catégorie Objective</td></tr>
              <tr><td>8</td><td>Contribution tactique</td><td>Catégorie Tactician</td></tr>
            </tbody>
          </table></div>
          <p class="mute small">Un zéro confirmé est une valeur valide. Les médailles ou badges affichés sur l’écran de résultat ne sont pas des statistiques supplémentaires.</p>
          <h3>MOST : performance cumulée</h3>
          <p>Total de la statistique sur tous les matchs valides du joueur. Le total le plus élevé est classé premier. Exemple : A totalise 42 éliminations en 6 matchs, B en totalise 42 en 8 matchs : B est devant.</p>
          <h3>BEST : moyenne par match</h3>
          <p>Moyenne = total de la statistique ÷ nombre de matchs valides. Les matchs à zéro restent dans le calcul. Pour être classé, il faut avoir joué au moins le <b>seuil</b> : la médiane du nombre de matchs des joueurs ayant au moins un match valide, arrondie à l’entier supérieur. Exemple : avec 3, 4, 4, 5 et 8 matchs, la médiane est 4, le seuil est donc 4 ; une médiane de 4,2 donnerait un seuil de 5.</p>
          <h3>BEST Survivor</h3>
          <p>Deux conditions : avoir joué au moins le seuil, et avoir une moyenne de score au moins égale au premier quartile (Q1) des moyennes de score de <b>tous</b> les joueurs ayant au moins un match valide, y compris ceux sous le seuil. Parmi les joueurs éligibles, la moyenne de morts par match la plus faible l’emporte.</p>
        </article>

        <article class="chap" id="r-dep">
          <h2><span class="cn">7</span>Départages et égalités</h2>
          <div class="scroll"><table>
            <thead><tr><th>Distinction</th><th>Critère principal</th><th>2e critère</th><th>3e critère</th></tr></thead>
            <tbody>
              <tr><td>MOST</td><td>Total le plus élevé</td><td>Plus de matchs joués</td><td>Score total le plus élevé</td></tr>
              <tr><td>BEST</td><td>Moyenne exacte la plus élevée</td><td>Plus de matchs joués</td><td>Score total le plus élevé</td></tr>
              <tr><td>BEST Survivor</td><td>Moyenne de morts la plus faible</td><td>Plus de matchs joués</td><td>Score total le plus élevé</td></tr>
            </tbody>
          </table></div>
          <ul>
            <li>Une seule distinction pour un seul lauréat : ni co-lauréats, ni tirage au sort.</li>
            <li>Si les trois critères laissent une égalité parfaite, la distinction est <b>non attribuée</b>. Il est interdit de choisir le joueur suivant du classement, ou d’inventer un critère après la clôture.</li>
            <li>Les valeurs exactes sont comparées. Les arrondis servent seulement à l’affichage.</li>
          </ul>
        </article>

        <article class="chap" id="r-cal">
          <h2><span class="cn">8</span>Calendrier, publication et réclamations</h2>
          <ul>
            <li>Classement provisoire publié le <b>dimanche, tous les 14 jours</b>.<span class="chg">Confirmé</span></li>
            <li>Coupure le <b>samedi à 17 h</b> : un match dont la capture indique une heure de fin avant 17 h compte dans le provisoire du lendemain, les autres comptent dans le suivant.</li>
            <li>Les 7 derniers jours de la saison sont réservés au gel des résultats, à l’audit, aux réclamations et à la validation finale. Le classement final est publié ensuite.</li>
            <li>Réclamation en privé dans les <b>48 heures</b> suivant la publication ou la notification, en indiquant le match concerné, le motif et les preuves.</li>
            <li>Les classements provisoires sont toujours distingués des résultats finaux.</li>
          </ul>
        </article>

        <article class="chap" id="r-lots">
          <h2><span class="cn">9</span>Récompenses et redistribution</h2>
          <ul>
            <li>Un joueur peut remporter plusieurs titres, mais ne reçoit qu’<b>un seul lot matériel</b> sur toute la distribution. Il ne choisit pas la distinction à laquelle son lot est rattaché.</li>
            <li>Les lots dépendent des moyens et des partenaires réellement confirmés. Aucun lot n’est annoncé avant confirmation.</li>
          </ul>
          <h3>Ordre obligatoire de priorité</h3>
          <div class="scroll"><table>
            <thead><tr><th>Ordre</th><th>Distinction</th><th>Ordre</th><th>Distinction</th></tr></thead>
            <tbody>
              <tr><td>1</td><td>MOST Eliminator</td><td>7</td><td>BEST Eliminator</td></tr>
              <tr><td>2</td><td>MOST Medic</td><td>8</td><td>BEST Medic</td></tr>
              <tr><td>3</td><td>MOST Engineer</td><td>9</td><td>BEST Engineer</td></tr>
              <tr><td>4</td><td>MOST Tactician</td><td>10</td><td>BEST Tactician</td></tr>
              <tr><td>5</td><td>MOST Objective</td><td>11</td><td>BEST Objective</td></tr>
              <tr><td>6</td><td>BEST Survivor</td><td></td><td></td></tr>
            </tbody>
          </table></div>
          <h3>Redistribution</h3>
          <ul>
            <li>Pour chaque catégorie, on part du lauréat sportif. S’il a déjà reçu un lot, le lot passe au joueur suivant éligible de cette catégorie qui n’a encore rien reçu.</li>
            <li>Le bénéficiaire reçoit le lot mais ne devient pas lauréat : le titre reste au lauréat sportif.</li>
            <li>Si aucun bénéficiaire unique ne peut être déterminé, ou si tous les éligibles ont déjà un lot, le lot reste non attribué.</li>
          </ul>
        </article>

        <article class="chap" id="r-sanc">
          <h2><span class="cn">10</span>Intégrité et sanctions</h2>
          <h3>Comportements interdits</h3>
          <ul>
            <li>Utiliser plusieurs comptes pour cumuler des statistiques ou occuper plusieurs places dans un match.</li>
            <li>Partager ou manipuler des comptes pour fausser l’identité ou les résultats.</li>
            <li>Organiser du farming d’éliminations, d’assistances ou de réanimations, ou s’entendre pour manipuler un match.</li>
            <li>Falsifier ou recadrer une capture de façon trompeuse, ou transmettre des captures contradictoires.</li>
            <li>Fournir une fausse identité, un pseudo ou un UID incorrect, ou contourner une sanction.</li>
            <li>Avoir un comportement toxique envers les autres joueurs.</li>
          </ul>
          <h3>Mesures possibles</h3>
          <p>Demande d’explication, avertissement, retrait de statistiques, invalidation d’un résultat, <b>suspension temporaire</b> (date de fin fixée par l’organisation, matchs non comptabilisés pendant la période) ou <b>exclusion définitive</b> (faits graves ou répétés). Pendant une sanction, le matricule est conservé et les comptes de jeu sont inactifs.</p>
          <p>Une anomalie statistique n’est jamais, à elle seule, une preuve de fraude : elle déclenche une vérification humaine, jamais une sanction automatique. Le joueur est toujours informé du motif, peut présenter sa version des faits et dispose d’un recours sous 48 heures.</p>
        </article>

        <article class="chap" id="r-conf">
          <h2><span class="cn">11</span>Confidentialité</h2>
          <ul>
            <li>Publics : nom de gamer, pseudos, matricule et statistiques des classements.</li>
            <li>Privés : identité, e-mail, date de naissance, UID (visible uniquement par l’organisation et le joueur concerné) et historique des comptes.</li>
            <li>Ne publiez jamais les informations personnelles ou l’UID d’un autre joueur. Pour toute question ou contestation, utilisez le canal privé indiqué par l’organisation.</li>
          </ul>
        </article>

        <article class="chap" id="r-chg">
          <h2>Ce qui change par rapport au guide PDF</h2>
          <ul>
            <li>Taille minimale d’un match : 16 participants (la mention « 20 participants maximum » était une erreur).</li>
            <li>Au moins 30 % de membres inscrits par match.</li>
            <li>Matchs libres : déclaration préalable obligatoire, un match par créneau, capture sous 30 minutes.</li>
            <li>Comptes : 2 comptes enregistrés au maximum, un seul actif, 7 jours entre deux changements. Changement de pseudo par simple déclaration.</li>
            <li>Langue : comprendre le malgache est essentiel ; le parler est une information non bloquante.</li>
            <li>Statuts : suspension, retrait, réintégration et périodes de comptabilisation.</li>
            <li>Classement provisoire tous les 14 jours, le dimanche, avec coupure le samedi à 17 h.</li>
          </ul>
        </article>
      </div>
    </div>
  </div>
</section>

<!-- ============ PROCESSUS ============ -->
<section class="view" data-view="processus" hidden>
  <div class="band">
    <div class="wrap">
      <div class="sec-head"><h1>Processus</h1><p>Chaque étape, dans l’ordre, pour savoir qui fait quoi et à quel moment.</p></div>
      <div class="flows">
        <div class="flow">
          <h3>Inscription</h3><p>De la demande au matricule.</p>
          <ol class="rail">
            <li><b>Formulaire</b><span>Page Participer : le site prépare votre message.</span></li>
            <li><b>Envoi en privé</b><span>Message et capture du profil (pseudo et UID visibles) à l’organisation.</span></li>

function controlesInscription(i) {

async function telecharger(nom, contenu, type) {
  const dl = await cap('downloads');
  if (!dl || typeof dl.save !== 'function') throw new Error('téléchargement indisponible ici, utilisez « Copier »');
  try { await dl.save({ filename: nom, data: contenu }); }
  catch (e) {
    if (e instanceof TypeError || /type|data|blob|string/i.test(String((e && e.message) || ''))) await dl.save({ filename: nom, data: new Blob([contenu], { type }) });
    else throw e;
  }
}

  UI.vue = vue;
  if (t && TAB[t] && TABS_ACTIFS.indexOf(t) >= 0 && UI.tab !== t) { UI.tab = t; UI.tabRendu = ''; if (t !== 'membres') UI.membre = ''; }
  $$('.view').forEach(s => { s.hidden = s.dataset.view !== vue; });
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === vue));
  rendre();
  if (chg) window.scrollTo(0, 0);
}
function lierEvenements() {
  window.addEventListener('hashchange', router);
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a && a.dataset.act !== 'lot-toggle') { const H = ACTIONS[a.dataset.act]; if (H) { e.preventDefault(); H(a, e); } return; }
    const g = e.target.closest('[data-goto]');
    if (g) { const el = document.getElementById(g.dataset.goto); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
    const sg = e.target.closest('#cl-seg button');
    if (sg) { UI.grp = sg.dataset.grp; rendreClassementsPublic(); }
  });
  const saisie = e => {
    const t = e.target;
    if (MODE === 'editeur' && ED && t.closest('#modal-b')) { surSaisieEditeur(e); return; }
    if (MODE === 'insc-decision' && t.name === 'dec') { const z = $('#dec-app'); if (z) z.hidden = t.value !== 'Approuver'; return; }
    if (MODE === 'saisie-insc' && t.closest('#si-champs')) { majVisibilite(DEM.inscription.champs, 'm-', $('#si-champs')); return; }
    if (MODE === 'modif-membre' && t.closest('#mo-champs')) { majVisibilite(DEM.inscription.champs.filter(f => PERSO.indexOf(f.k) >= 0), 'e-', $('#mo-champs')); return; }
    if (t.name === 'dem-type' && e.type === 'change') { UI.demType = t.value; afficherDemande(); return; }
    if (t.closest('#dem-champs')) { majVisibilite(DEM[UI.demType].champs, 'f-', $('#dem-champs')); return; }
    if (t.id === 'cl-arch' && e.type === 'change') { UI.archive = t.value; rendreClassementsPublic(); return; }
    if (t.id === 'mb-rech') { UI.rech = t.value; $('#adm-body').innerHTML = TAB.membres.body(); return; }
    if (t.id === 'mb-filtre') { UI.filtreMb = t.value; $('#adm-body').innerHTML = TAB.membres.body(); return; }
    if (t.id === 'j-rech') { UI.jRech = t.value; UI.jMax = 100; $('#adm-body').innerHTML = TAB.journal.body(); return; }
    if (e.type !== 'change') return;
    if (t.id === 'ma-s') { UI.matchSaison = t.value; rendreAdmin(); }
    else if (t.id === 'cl-s') { UI.clSaison = t.value; UI.clCoupure = ''; const s = saisonPar(t.value); if (s) $('#cl-coupure').value = coupureParDefaut(s, UI.clType); rendreAdmin(); }
    else if (t.id === 'cl-type') { UI.clType = t.value; UI.clCoupure = ''; const s = saisonPar(UI.clSaison) || saisonActive(); if (s) $('#cl-coupure').value = coupureParDefaut(s, UI.clType); rendreAdmin(); }
    else if (t.id === 'cl-coupure') { UI.clCoupure = L.normDT(t.value); rendreAdmin(); }
    else if (t.id === 'lo-s') { UI.lotSaison = t.value; rendreAdmin(); }
    else if (t.dataset.act === 'lot-toggle') {
      const s = saisonPar(UI.lotSaison) || saisonActive(); if (!s) return;
      const lots = Object.assign({}, s.lots || {}); lots[t.dataset.k] = t.checked;
      agir(async () => { await ecrire('saisons', s.id, Object.assign({}, s, { lots })); await noter('Lots', s.id, (t.checked ? 'Lot confirmé : ' : 'Lot retiré : ') + t.dataset.k, ''); });
    }
  };
  document.addEventListener('input', saisie);
  document.addEventListener('change', saisie);
  $('#dem-form').addEventListener('submit', soumettreDemande);
  document.addEventListener('submit', e => { if (e.target.id === 'f-connexion') seConnecter(e); else if (e.target.id === 'f-mdp') changerMdp(e); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) fermerModal(); });
}
/* ---------------- Supabase (lot socle) ---------------- */
const CFG = window.DFMM_CONFIG || null;
// Lien de réinitialisation : lu AVANT que la bibliothèque n'efface l'adresse.
const RETOUR_LIEN = (() => { const h = new URLSearchParams((location.hash || '').replace(/^#/, '')); return { recup: h.get('type') === 'recovery', erreur: h.get('error_code') || h.get('error') || '' }; })();
const SB = (window.supabase && CFG) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabasePublishableKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
const PARAM = {};
let PARAMS = [], SESSION = null, RECUP = RETOUR_LIEN.recup;
// Écoute branchée tout de suite, pour ne pas manquer le signal « réinitialisation ».
if (SB) SB.auth.onAuthStateChange((evt, session) => {
  if (evt === 'PASSWORD_RECOVERY') { RECUP = true; if (PRET) location.hash = '#compte'; }
  if (PRET) setTimeout(() => { majSession(session); }, 0);
});

async function chargerParametres() {
  if (!SB) return;
  const { data, error } = await SB.from('parametres').select('*').order('section').order('ordre');
  if (error) { console.warn('Paramètres illisibles :', error.message); return; }
  PARAMS = data || [];
  PARAMS.forEach(p => { PARAM[p.cle] = p.valeur; });
}
function rendreBandeau() {
  const b = $('#banner');
  if (!SB) { b.hidden = false; b.className = 'banner test'; b.textContent = 'Connexion à la base impossible pour le moment : vérifiez votre connexion Internet.'; return; }
  if (PARAM.version_test === false) { b.hidden = true; return; }
  b.hidden = false; b.className = 'banner test';
  b.textContent = 'Version de test : ' + (PARAM.inscriptions_ouvertes === true ? '' : 'les inscriptions sont fermées et ') + 'aucune donnée n’est officielle.';
}
async function majSession(session) {
  SESSION = session || null;
  let adm = false;
  if (SB && SESSION) { const { data } = await SB.rpc('est_admin'); adm = data === true; }
  ADMIN = adm;
  $('#nav-admin').hidden = !ADMIN;
  $('#nav-compte').textContent = SESSION ? 'Mon compte' : 'Connexion';
  UI.tabRendu = '';
  rendre();
}
function rendreCompte() {
  const z = $('#compte-zone');
  if (!SB) { z.innerHTML = note('Connexion impossible pour le moment.', 'r'); return; }
  if (!PRET) { z.innerHTML = '<p class="mute">Chargement…</p>'; return; }
  const lienPerime = !SESSION && (RETOUR_LIEN.erreur || RECUP);
  if (SESSION && RECUP) {
    z.innerHTML = '<form id="f-mdp" class="panel" novalidate><h3>Choisir un nouveau mot de passe</h3><label class="lab" for="n-mdp">Nouveau mot de passe (8 caractères au moins)</label><input type="password" id="n-mdp" autocomplete="new-password"><label class="lab" for="n-mdp2">Le même, une seconde fois</label><input type="password" id="n-mdp2" autocomplete="new-password"><div id="n-err" class="err" role="alert"></div><div class="row-btns"><button class="btn" type="submit">Enregistrer</button></div></form>';
    return;
  }
  if (SESSION) {
    z.innerHTML = '<div class="panel"><h3>Vous êtes connecté</h3><p>' + esc(SESSION.user.email) + (ADMIN ? ' · administrateur' : '') + '</p><div class="row-btns">' + (ADMIN ? '<a class="btn" href="#admin">Administration</a>' : '') + '<button class="btn ghost" type="button" data-act="deconnexion">Se déconnecter</button></div></div>' + (ADMIN ? '' : note('L’espace membre arrive dans une prochaine version du site.'));
    return;
  }
  z.innerHTML = (lienPerime ? note('Ce lien n’est plus valable : il a expiré ou a déjà servi. Demandez un nouveau lien à Katana sur Messenger.', 'r') : '') + '<form id="f-connexion" class="panel" novalidate><h3>Se connecter</h3><label class="lab" for="c-email">E-mail</label><input type="email" id="c-email" autocomplete="email"><label class="lab" for="c-mdp">Mot de passe</label><input type="password" id="c-mdp" autocomplete="current-password"><div id="c-err" class="err" role="alert"></div><div class="row-btns"><button class="btn" type="submit">Se connecter</button></div><p class="mute small">Mot de passe oublié ? Écrivez à Katana sur Messenger : il vous enverra un lien pour en choisir un nouveau.</p></form>' + (PARAM.inscriptions_ouvertes === true ? '' : note('Les inscriptions ouvriront au lancement officiel de la LEAGUE UV.'));
}
async function seConnecter(e) {
  e.preventDefault();
  const err = $('#c-err'), email = v('c-email'), mdp = $('#c-mdp').value, btn = e.submitter;
  err.textContent = '';
  if (!email || !mdp) { err.textContent = 'Indiquez votre e-mail et votre mot de passe.'; return; }
  if (btn) btn.disabled = true;
  const { error } = await SB.auth.signInWithPassword({ email, password: mdp });
  if (btn) btn.disabled = false;
  if (error) err.textContent = 'Connexion impossible : e-mail ou mot de passe incorrect.';
}
async function changerMdp(e) {
  e.preventDefault();
  const a = $('#n-mdp').value, b = $('#n-mdp2').value, err = $('#n-err');
  err.textContent = '';
  if (a.length < 8) { err.textContent = 'Le mot de passe doit faire 8 caractères au moins.'; return; }
  if (a !== b) { err.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }
  const { error } = await SB.auth.updateUser({ password: a });
  if (error) { err.textContent = 'Enregistrement impossible : ' + error.message; return; }
  RECUP = false; toast('Nouveau mot de passe enregistré.'); rendreCompte();
}
async function seDeconnecter() { await SB.auth.signOut(); RECUP = false; toast('Vous êtes déconnecté.'); location.hash = '#accueil'; }

/* ----- Administration : paramètres ----- */
function champParam(p) {
  const id = 'p-' + p.cle, x = p.valeur;
  if (p.type === 'booleen') return '<select id="' + id + '"><option value="true"' + (x === true ? ' selected' : '') + '>Oui</option><option value="false"' + (x === false ? ' selected' : '') + '>Non</option></select>';
  if (p.type === 'jour') return '<select id="' + id + '">' + JOURS.map((j, i) => '<option value="' + i + '"' + (x === i ? ' selected' : '') + '>' + j + '</option>').join('') + '</select>';
  if (p.type === 'heure') return '<input type="time" id="' + id + '" value="' + esc(x) + '">';
  if (p.type === 'texte') return '<input type="text" id="' + id + '" value="' + esc(x) + '">';
  return '<input type="number" id="' + id + '" min="0" step="' + (p.type === 'decimal' ? '0.1' : '1') + '" inputmode="decimal" value="' + esc(x) + '">';
}
function lireParam(p) {
  const x = $('#p-' + p.cle).value;
  if (p.type === 'booleen') return x === 'true';
  if (p.type === 'jour') return Number(x);
  if (p.type === 'heure' || p.type === 'texte') return x;
  const n = Number(String(x).replace(',', '.'));
  return x === '' || isNaN(n) ? null : n;
}
TAB.parametres = {
  body: () => {
    if (!PARAMS.length) return note('Paramètres introuvables : la migration 0001 n’a pas encore été exécutée dans Supabase.', 'r');
    const sections = PARAMS.map(p => p.section).filter((x, i, a) => a.indexOf(x) === i);
    return note('Chaque changement s’applique tout de suite et reste dans l’historique.') + sections.map(sec => '<div class="panel"><h3>' + esc(sec) + '</h3><div class="scroll"><table><tbody>' + PARAMS.filter(p => p.section === sec).map(p => '<tr><td>' + esc(p.libelle) + '</td><td style="min-width:140px">' + champParam(p) + '</td><td><button class="btn sm" type="button" data-act="param-enregistrer" data-k="' + esc(p.cle) + '">Enregistrer</button></td></tr>').join('') + '</tbody></table></div></div>').join('') + '<div class="panel"><h3>Derniers changements</h3><div id="param-hist" class="mute small">Chargement…</div></div>';
  }
};
async function enregistrerParam(cle) {
  const p = PARAMS.find(x => x.cle === cle); if (!p) return;
  const val = lireParam(p);
  if (val === null) { toast('Valeur invalide.', true); return; }
  const { data, error } = await SB.from('parametres').update({ valeur: val }).eq('cle', cle).select();
  if (error) { toast('Refusé : ' + error.message, true); return; }
  if (!data || !data.length) { toast('Modification refusée : droits insuffisants.', true); return; }
  p.valeur = data[0].valeur; PARAM[cle] = p.valeur;
  toast('Paramètre enregistré.'); rendreBandeau(); chargerHistorique();
}
async function chargerHistorique() {
  const z = $('#param-hist'); if (!z || !SB) return;
  const { data, error } = await SB.from('parametres_historique').select('*').order('modifie_le', { ascending: false }).limit(15);
  if (!$('#param-hist')) return;
  if (error) { z.textContent = 'Historique illisible : ' + error.message; return; }
  const lib = k => (PARAMS.find(p => p.cle === k) || {}).libelle || k;
  z.innerHTML = data.length ? '<ul class="taches">' + data.map(h => '<li><span>' + esc(lib(h.cle)) + ' : ' + esc(JSON.stringify(h.ancienne_valeur)) + ' → ' + esc(JSON.stringify(h.nouvelle_valeur)) + '</span><span class="dim nowrap">' + esc(new Date(h.modifie_le).toLocaleString('fr-FR', { timeZone: 'Indian/Antananarivo' })) + '</span></li>').join('') + '</ul>' : 'Aucun changement pour l’instant.';
}

/* ----- Administration : accès des joueurs ----- */
TAB.acces = {
  shell: () => '<div class="panel"><h3>Lien de réinitialisation du mot de passe</h3><p class="mute small">Aucun e-mail n’est envoyé. Copiez le lien et envoyez-le au joueur en privé sur Messenger. Il ne sert qu’une fois et expire vite (1 heure par défaut).</p><label class="lab" for="l-email">E-mail du compte du joueur</label><input type="email" id="l-email" autocomplete="off"><div class="row-btns"><button class="btn" type="button" data-act="lien-creer">Créer le lien</button></div><div id="l-sortie"></div></div>',
  body: () => ''
};
async function creerLien(b) {
  const email = v('l-email'), out = $('#l-sortie');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { out.innerHTML = '<p class="err">Adresse e-mail invalide.</p>'; return; }
  b.disabled = true; out.innerHTML = '<p class="mute">Création du lien…</p>';
  const { data, error } = await SB.functions.invoke('lien-reinitialisation', { body: { email, redirectTo: location.origin + location.pathname } });
  b.disabled = false;
  if (error || !data || !data.lien) {
    let m = data && data.erreur;
    if (!m && error && error.context && typeof error.context.json === 'function') { try { m = (await error.context.json()).erreur; } catch (e) { m = ''; } }
    out.innerHTML = '<p class="err">' + esc(m || 'Création impossible. La fonction « lien-reinitialisation » est-elle installée dans Supabase ?') + '</p>';
    return;
  }
  out.innerHTML = '<label class="lab" for="l-lien">Lien à envoyer au joueur</label><textarea id="l-lien" class="msg-out" rows="4" readonly>' + esc(data.lien) + '</textarea><div class="row-btns"><button class="btn" type="button" data-act="lien-copier">Copier le lien</button></div>';
}

async function demarrer() {
  $('#app').replaceChildren($('#tpl').content.cloneNode(true));
  try { PUB = JSON.parse($('#pub-data').textContent || 'null'); } catch (e) { PUB = null; }
  initParticiper();
  lierEvenements();
  router();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (SB) {
    const { data } = await SB.auth.getSession();
    await chargerParametres();
    PRET = true;
    if (RECUP || RETOUR_LIEN.erreur) location.hash = '#compte';
    await majSession(data.session);
  } else PRET = true;
  rendreBandeau();
  router();
}
demarrer();
})();
</script>
