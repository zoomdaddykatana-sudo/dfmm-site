  const R = reglesSite(); if (!R || !UI.clSaison) { z.textContent = ''; return; }
  const P = parametresCalcul();
  $('#cl-date-z').hidden = P.type === 'Final';
  z.innerHTML = P.type === 'Final'
    ? 'Classement final : tous les matchs validés terminés jusqu’au ' + fD(P.s.fin) + ' inclus ; vérification jusqu’au ' + fDT(P.finVerif) + ' ; publication prévue le ' + fD(P.datePub) + '. Les décisions comptent jusqu’à la publication.'
    : (P.coupure ? 'Coupure : <b>' + fDT(P.coupure) + '</b> (heure d’envoi de la capture). Vos matchs comptent s’ils sont validés avant la publication ; une ligne identifiée ou un match en attente tranché après la coupure compte pour le classement suivant.' : 'Choisissez la date de publication.');
}
function controleClassement(P, agg, cl) {
  const items = [], inclus = CX.matchsList.filter(m => L.matchDansClassement(m, P.s, { coupure: P.coupure, limiteDecisions: P.lim }));
  const pb = inclus.filter(m => L.controlesMatch(m, CX, P.s, P.R).bloquants.length);
  items.push([!pb.length, pb.length ? 'Matchs validés qui ne passent plus les contrôles : ' + pb.map(m => m.id).join(', ') + '. Repassez-les en brouillon pour corriger.' : 'Les ' + inclus.length + ' match(s) inclus passent les contrôles du cahier.']);
  items.push([agg.nbMatchs > 0, agg.nbMatchs ? agg.nbMatchs + ' match(s) compté(s).' : 'Aucun match validé à compter : rien à publier.']);
  const attente = CX.matchsList.filter(m => (m.statut === 'Brouillon' || m.statut === 'En attente') && L.validDT(m.fin) && m.fin < (P.coupure || '9'));
  if (attente.length) items.push([null, attente.length + ' match(s) en brouillon ou en attente, terminés avant la coupure, ne comptent pas : ' + attente.map(m => m.id).join(', ') + '.']);
  const aid = inclus.reduce((n, m) => n + m.lignes.filter(l => l.res === 'à identifier').length, 0);
  if (aid) items.push([null, aid + ' ligne(s) « à identifier » dans les matchs comptés : elles ne comptent pas tant qu’elles ne sont pas identifiées.']);
  const actifs = {}; CX.comptesList.filter(c => c.statut === 'actif').forEach(c => { actifs[c.matricule] = (actifs[c.matricule] || 0) + 1; });
  const multi = Object.keys(actifs).filter(k => actifs[k] > 1);
  items.push([!multi.length, multi.length ? 'Plusieurs comptes actifs : ' + multi.join(', ') + '.' : 'Un seul compte actif par matricule.']);
  if (P.type === 'Final') {
    items.push([!!P.finVerif && now() >= P.finVerif, P.finVerif && now() >= P.finVerif ? 'Vérification de fin de saison terminée.' : 'Vérification de fin de saison en cours jusqu’au ' + fDT(P.finVerif) + ' : publication impossible avant.']);
    if (P.datePub && now().slice(0, 10) !== P.datePub) items.push([null, 'Publication prévue le ' + fD(P.datePub) + '.']);
    if (PUBS.some(p => String(p.saison_id) === String(P.s.id) && p.type === 'Final')) items.push([false, 'Le classement final de cette saison est déjà publié.']);
  } else {
    items.push([L.validD(P.datePub) && L.dow(P.datePub) === P.R.publication_jour, 'Publication un ' + JOURS[P.R.publication_jour].toLowerCase() + ' : ' + (L.validD(P.datePub) ? fD(P.datePub) : '—') + '.']);
    items.push([!!P.coupure && P.coupure <= now(), P.coupure && P.coupure <= now() ? 'Coupure passée (' + fDT(P.coupure) + ').' : 'Coupure pas encore passée : attendez le ' + fDT(P.coupure) + '.']);
    if (PUBS.some(p => String(p.saison_id) === String(P.s.id) && p.type === 'Provisoire' && p.coupure === P.coupure)) items.push([false, 'Un classement provisoire avec cette coupure est déjà publié.']);
  }
  items.push([true, 'Seuil BEST : médiane des matchs joués, arrondie au supérieur = ' + cl.seuil + '. Q1 du score moyen = ' + fN(cl.q1, 2) + '.']);
  const co = cl.cats.filter(c => c.statut === 'Co-lauréats').map(c => c.label);
  if (co.length) items.push([true, 'Égalité parfaite en tête (co-lauréats) : ' + co.join(', ') + '.']);
  return items;
}
async function calculerClassement() {
  const z = $('#cl-res'), R = reglesSite();
  if (!R) { z.innerHTML = note('Réglages de la ligue non chargés.', 'r'); return; }
  const P = parametresCalcul();
  if (!P.coupure) { z.innerHTML = note('Choisissez une date de publication.', 'a'); return; }
  z.innerHTML = '<p class="mute">Calcul en cours…</p>';
  try { await chargerContexte(P.s.id); await chargerPublic(); } catch (e) { z.innerHTML = note('Lecture impossible : ' + esc(e.message), 'r'); return; }
  const agg = L.agreger(CX, P.s, { coupure: P.coupure, limiteDecisions: P.lim });
  const cl = L.classer(agg, CX.membres, P.coupure);
  const ctl = controleClassement(P, agg, cl);
  CLC = { P, agg, cl, ctl };
  const numero = PUBS.filter(p => String(p.saison_id) === String(P.s.id) && p.type === 'Provisoire').length + 1;
  let h = '<div class="kpis">' + [[agg.nbMatchs, 'matchs comptés'], [cl.pop.length, 'joueurs classés'], [cl.seuil, 'seuil BEST (matchs)'], [fN(cl.q1, 2), 'Q1 du score moyen']].map(([a, b]) => '<div class="kpi"><b>' + a + '</b><span>' + b + '</span></div>').join('') + '</div>';
  h += '<p class="mute">Aperçu du classement ' + (P.type === 'Final' ? 'final' : 'provisoire n° ' + numero) + ' de ' + esc(P.s.nom) + '.</p>';
  h += '<div class="panel"><h3>Contrôle avant publication</h3><ul class="chk">' + ctl.map(([ok, t]) => '<li class="' + (ok === true ? 'o' : ok === null ? 'w' : 'b') + '">' + esc(t) + '</li>').join('') + '</ul>'
    + '<h3 style="margin-top:12px">Vérifications manuelles</h3><label class="coche"><input type="checkbox" id="cl-v1"><span>Les captures des matchs comptés ont été vérifiées.</span></label><label class="coche"><input type="checkbox" id="cl-v2"><span>Les réclamations en cours ont été traitées ou n’affectent pas ce classement.</span></label><label class="coche"><input type="checkbox" id="cl-v3"><span>La publication ne contient aucune donnée personnelle (seulement noms de gamer, pseudos, matricules et statistiques).</span></label>'
    + '<div class="row-btns"><button class="btn" type="button" data-act="cl-publier"' + (ctl.some(([ok]) => ok === false) ? ' disabled' : '') + '>Publier ce classement</button><button class="btn ghost" type="button" data-act="cl-facebook">Texte pour Facebook</button></div></div>';
  const apercu = { type: P.type, seuil: cl.seuil, q1: cl.q1 };
  h += '<div class="cl-grid">' + contenuClassement(P, agg, cl).categories.map(c => carteCl(c, apercu, true)).join('') + '</div>';
  z.innerHTML = h;
}
function contenuClassement(P, agg, cl) {
  const R = P.R;
  return {
    saison: { id: P.s.id, nom: P.s.nom, debut: P.s.debut, fin: P.s.fin }, recours_jusqu: P.type === 'Final' ? null : L.addMinutes(now(), R.reclamation_h * 60),
    nb_matchs: agg.nbMatchs, nb_joueurs: cl.pop.length, seuil: cl.seuil, q1: cl.q1,
    categories: cl.cats.map(c => ({ key: c.key, label: c.label, kind: c.kind, statut: c.statut,
      laureats: c.laureats.map(j => ({ mat: j.mat, nom: nomMat(j.mat), val: c.lignes.find(l => l.j === j).val })),
      lignes: c.lignes.map(l => ({ rang: l.rang, egal: l.egal, mat: l.j.mat, nom: nomMat(l.j.mat), pseudos: pseudosMat(l.j.mat), val: l.val, n: l.j.n })) }))
  };
}
async function publierClassementSB(b) {
  if (!CLC) return;
  const { P, agg, cl, ctl } = CLC;
  if (ctl.some(([ok]) => ok === false)) { toast('Contrôle non satisfait : corrigez les points en rouge avant de publier.', true); return; }
  if (!coche('cl-v1') || !coche('cl-v2') || !coche('cl-v3')) { toast('Cochez les trois vérifications manuelles avant de publier.', true); return; }
  if (!confirm('Publier ce classement ? Une fois publié, il ne peut plus être modifié ni supprimé.')) return;
  b.disabled = true;
  const { error } = await SB.from('publications').insert({ saison_id: P.s.id, type: P.type === 'Final' ? 'final' : 'provisoire', coupure: locISO(P.coupure), contenu: contenuClassement(P, agg, cl) });
  b.disabled = false;
  if (error) { toast('Publication impossible : ' + erreurRpc(error), true); return; }
  await chargerPublic();
  toast('Classement publié : il est visible sur la page Classements.');
  CLC = null; $('#cl-res').innerHTML = ''; afficherPubliees();
}

function texteFacebook(p) {

ACTIONS['cl-calculer'] = () => calculerClassement();

async function comparerLecturesSB() {
  const z = $('#ed-conc'), gs = groupesEnvois(), lectures = [];
  for (const gr of gs) {
    const t = v('lec-' + gr.k); if (!t) { z.innerHTML = note('Collez la lecture de ' + esc(gr.nom) + '.', 'r'); return; }
    let r; try { r = JSON.parse(extraireJSON(t)); } catch (e) { z.innerHTML = note('Lecture de ' + esc(gr.nom) + ' illisible : collez toute la réponse de claude.ai.', 'r'); return; }
    lectures.push({ nom: gr.nom, k: gr.k, caps: gr.caps, lecture: r });
    const { error } = await SB.rpc('noter_lecture', { p_captures: gr.caps.map(c => c.id), p_lecture: r });
    if (error) { z.innerHTML = note('Lecture non enregistrée : ' + esc(erreurRpc(error)), 'r'); return; }
    gr.caps.forEach(c => { c.lecture = r; });
  }
  ED.lectures = lectures;
  const c = L.comparerLectures(lectures);
  let h = c.alertes.length ? chk({ W: c.alertes }) : '';
  if (c.concordant) {
    h += note('<b>Captures concordantes</b> : mêmes joueurs, mêmes statistiques, même carte, même vainqueur. Gardez la capture la plus lisible ; les autres sont écartées et supprimées.')
      + '<label class="lab" for="ed-garder">Capture à garder</label><select id="ed-garder">' + lectures.map((x, i) => '<option value="' + i + '">' + esc(x.nom) + '</option>').join('') + '</select>'

async function garderLectureSB() {

  ED.caps.forEach(c => { if (autres.indexOf(c.id) >= 0) c.statut = 'ecartee'; });

    if (prochain.noms) h += '<p class="small"><b>Noms</b> (visibles par vous seulement) : ' + (prochain.noms.length ? prochain.noms.map(x => esc(matTxt(x.matricule) + ' ' + x.nom_gamer)).join(', ') : 'personne pour l’instant') + '</p>';
    if (d.peut_participer && !commence) h += '<div class="row-btns">' + (prochain.moi ? '<span class="res auto">Vous participez</span><button class="btn sm ghost" type="button" data-act="ev-participer" data-id="' + prochain.id + '" data-oui="0">Je ne participe plus</button>' : '<button class="btn sm" type="button" data-act="ev-participer" data-id="' + prochain.id + '" data-oui="1">Je participe</button>') + '</div>';
    h += blocSalle(prochain.code, prochain.mot_de_passe, d.voit_code, prochain.salle_saisie, ouvertureTxt(prochain.debut, d.salle_ouverture_min)) + '</div>';
  }
  if (autres.length) h += '<h3>Dates suivantes</h3><div class="scroll"><table id="ev-dates"><thead><tr><th>Date</th><th>Carte</th><th>État</th></tr></thead><tbody>' + autres.map(j => '<tr><td>' + esc(jourTxt(j.debut)) + '</td><td>' + esc(j.statut === 'annule' ? '—' : (j.carte || '—')) + '</td><td>' + esc(ST_JOUR[j.statut] || j.statut) + (j.motif ? ' <span class="dim">(' + esc(j.motif) + ')</span>' : '') + '</td></tr>').join('') + '</tbody></table></div>';
  if ((d.rotation || []).length) h += '<p class="small mute">Rotation des cartes des matchs de Katana, en boucle : ' + d.rotation.map(esc).join(' → ') + '. Chaque mercredi et samedi, début à ' + esc(heureLoc('0000-00-00T' + (d.heure || ''))) + '.</p>';
  h += '</div><div class="panel" id="ev-libres"><h2 style="margin-top:0">Matchs libres annoncés</h2>';
  const lib = d.libres || [];
  if (!lib.length) h += '<p class="mute">Aucun match libre annoncé.' + (PARAM.matchs_libres_ouverts === true ? '' : ' Les matchs libres ouvriront au lancement de la LEAGUE UV.') + '</p>';
  lib.forEach(c => {
    const per = x => x ? esc(matTxt(x.matricule) + ' ' + x.nom_gamer) : '—';
    h += '<div class="card-l"><div class="t"><div><b>' + esc(jourTxt(c.debut)) + '</b><div class="small dim">L-' + c.id + ' · carte au choix de l’organisateur</div></div>' + badge('Libre', 'o') + '</div>'
      + '<dl class="kv"><dt>Organisateur</dt><dd>' + per(c.organisateur) + '</dd><dt>Responsable HAAVK</dt><dd>' + per(c.haavk) + '</dd><dt>Responsable GTI</dt><dd>' + per(c.gti) + '</dd></dl>'
      + blocSalle(c.code, c.mot_de_passe, d.voit_code || c.moi_organisateur, c.salle_saisie, ouvertureTxt(c.debut, d.salle_ouverture_min));
    if (c.moi_organisateur && d.peut_participer) h += '<div class="grid-f"><div><label class="lab" for="evl-code-' + c.id + '">Code de la salle</label><input type="text" id="evl-code-' + c.id + '" value="' + esc(c.code || '') + '" maxlength="100" autocomplete="off"></div>'
      + '<div><label class="lab" for="evl-mdp-' + c.id + '">Mot de passe</label><input type="text" id="evl-mdp-' + c.id + '" value="' + esc(c.mot_de_passe || '') + '" maxlength="100" autocomplete="off"></div></div>'
      + '<div class="row-btns"><button class="btn sm" type="button" data-act="ev-salle-libre" data-id="' + c.id + '">Enregistrer le code</button></div><p class="dim small">Vous êtes l’organisateur : saisissez le code et le mot de passe vers la création de la salle, environ ' + Number(d.salle_ouverture_min || 15) + ' min avant le début. Les vider les efface.</p>';
    h += '</div>';
  });
  h += '</div><div class="panel" id="ev-communaute"><h2 style="margin-top:0">Événements communautaires</h2>';
  const ev = d.evenements || [];
  h += ev.length ? ev.map(e => '<div class="card-l"><div class="t"><div><b>' + esc(e.titre) + '</b><div class="small dim">' + esc(jourTxt(e.debut)) + (e.fin ? ' → ' + esc(jourTxt(e.fin)) : '') + '</div></div></div>' + (e.description ? '<p style="white-space:pre-line">' + esc(e.description) + '</p>' : '') + '</div>').join('') : '<p class="mute">Aucun événement communautaire annoncé.</p>';
  return h + '</div>';
}
ACTIONS['ev-participer'] = async b => {
  b.disabled = true;
  const { error } = await SB.rpc('participer', { p_jour: Number(b.dataset.id), p_oui: b.dataset.oui === '1' });
  if (error) { toast(erreurRpc(error), true); b.disabled = false; return; }
  toast(b.dataset.oui === '1' ? 'C’est noté : vous participez.' : 'C’est noté : vous ne participez plus.'); rendreEvenements();
};
ACTIONS['ev-salle-libre'] = async b => {
  const id = b.dataset.id;
  const { error } = await SB.rpc('noter_salle', { p: { creneau_id: Number(id), code: v('evl-code-' + id), mot_de_passe: v('evl-mdp-' + id) } });
  if (error) { toast(erreurRpc(error), true); return; }
  toast('Code de la salle enregistré : les membres actifs non suspendus le voient.'); rendreEvenements();
};

/* Administration : calendrier des matchs de Katana et événements communautaires */
TAB.calendrier = {
  shell: () => note('Calendrier automatique : chaque mercredi et samedi, début à 16 h 05 (réglages dans Paramètres > Calendrier). Carte manquante : « Reporter » (la date suivante garde la carte). « Annuler la date » : pas de carte, la rotation continue.')
    + '<div id="cal-liste"><p class="mute">Chargement…</p></div>'
    + '<div class="panel" style="margin-top:16px"><h3>Nouvel événement communautaire</h3><p class="mute small">Visible seulement par les membres connectés, dans « Prochains événements », jusqu’à sa fin (ou jusqu’au lendemain s’il n’a pas de fin).</p>'
    + '<label class="lab" for="evc-titre">Titre</label><input type="text" id="evc-titre" maxlength="100">'
    + '<div class="grid-f"><div><label class="lab" for="evc-debut">Début (heure de Madagascar)</label><input type="datetime-local" id="evc-debut"></div><div><label class="lab" for="evc-fin">Fin (facultative)</label><input type="datetime-local" id="evc-fin"></div></div>'
    + '<label class="lab" for="evc-desc">Description</label><textarea id="evc-desc" rows="3"></textarea><div class="row-btns"><button class="btn" type="button" data-act="evc-creer">Créer l’événement</button></div></div>'
    + '<div id="evc-liste"></div>',
  body: () => '',
  charger: afficherCalendrierAdmin
};
let CAL = [];
async function afficherCalendrierAdmin() {
  const z = $('#cal-liste'); if (!z) return;
  const [r, e] = await Promise.all([SB.rpc('calendrier_admin'), SB.from('evenements').select('*').order('debut', { ascending: false })]);
  if (!z.isConnected) return;
  if (r.error) { z.innerHTML = note('Lecture impossible : ' + esc(erreurRpc(r.error)), 'r'); return; }
  CAL = r.data || [];
  z.innerHTML = CAL.length ? CAL.map(j => {
    const loc = isoLoc(j.debut);
    const etat = j.statut === 'prevu' ? (j.passe ? badge('Passé', 'o') : badge('Prévu', 'g')) : badge(ST_JOUR[j.statut], j.statut === 'reporte' ? 'a' : 'o');
    let h = '<div class="card-l" data-jour="' + j.id + '"><div class="t"><div><b>' + esc(fD(loc.slice(0, 10))) + ' à ' + esc(heureLoc(loc)) + '</b><div class="small dim">Carte : ' + esc(j.statut === 'annule' ? '—' : (j.carte || '—')) + (j.motif ? ' · ' + esc(j.motif) : '') + '</div></div>' + etat + '</div>';
    h += '<p class="small">Participants : <b>' + j.noms.length + '</b>' + (j.noms.length ? ' — ' + j.noms.map(x => esc(matTxt(x.matricule) + ' ' + x.nom_gamer)).join(', ') : '') + '</p>';
    if (j.statut === 'prevu' && j.salle_ouverte) h += '<div class="grid-f"><div><label class="lab" for="cal-code-' + j.id + '">Code de la salle</label><input type="text" id="cal-code-' + j.id + '" value="' + esc(j.code || '') + '" maxlength="100" autocomplete="off"></div><div><label class="lab" for="cal-mdp-' + j.id + '">Mot de passe</label><input type="text" id="cal-mdp-' + j.id + '" value="' + esc(j.mot_de_passe || '') + '" maxlength="100" autocomplete="off"></div></div>';
    else if (j.code || j.mot_de_passe) h += '<p class="small dim">Code ' + esc(j.code || '—') + ' · mot de passe ' + esc(j.mot_de_passe || '—') + ' (plus affichés aux membres)</p>';
    const btn = [];
    if (j.statut === 'prevu' && j.salle_ouverte) btn.push('<button class="btn sm" type="button" data-act="cal-salle" data-id="' + j.id + '">Enregistrer le code</button>');
    if (j.match_id) btn.push('<button class="btn sm ghost" type="button" data-act="m-ouvrir" data-id="' + j.match_id + '">Ouvrir le match M-' + j.match_id + '</button>');
    else if (j.statut === 'prevu') btn.push('<button class="btn sm ghost" type="button" data-act="cal-saisir" data-id="' + j.id + '">Saisir ce match</button>');
    if (j.modifiable && !j.match_id && j.statut === 'prevu') btn.push('<button class="btn sm ghost" type="button" data-act="cal-decider" data-d="reporter" data-id="' + j.id + '">Reporter (carte manquante)</button><button class="btn sm danger" type="button" data-act="cal-decider" data-d="annuler" data-id="' + j.id + '">Annuler la date</button>');
    if (j.modifiable && j.statut !== 'prevu') btn.push('<button class="btn sm ghost" type="button" data-act="cal-decider" data-d="retablir" data-id="' + j.id + '">Rétablir</button>');
    return h + (btn.length ? '<div class="row-btns">' + btn.join('') + '</div>' : '') + '</div>';
  }).join('') : note('Aucune date dans le calendrier.');
  const zl = $('#evc-liste'); if (!zl) return;
  const ev = (e && !e.error && e.data) || [];
  zl.innerHTML = ev.length ? '<h3>Événements communautaires</h3>' + ev.map(x => '<div class="card-l"><div class="t"><div><b>' + esc(x.titre) + '</b><div class="small dim">' + esc(jourTxt(x.debut)) + (x.fin ? ' → ' + esc(jourTxt(x.fin)) : '') + (x.retire_le ? ' · retiré le ' + dateLoc(x.retire_le) : '') + '</div></div>' + (x.retire_le ? badge('Retiré', 'o') : badge('En ligne', 'g')) + '</div>'
    + (x.description ? '<p style="white-space:pre-line">' + esc(x.description) + '</p>' : '') + (x.retire_le ? '' : '<div class="row-btns"><button class="btn sm ghost" type="button" data-act="evc-modifier" data-id="' + x.id + '">Modifier</button><button class="btn sm ghost" type="button" data-act="evc-retirer" data-id="' + x.id + '">Retirer</button></div>') + '</div>').join('') : '';
  UI.evc = ev;
}
ACTIONS['cal-salle'] = async b => {
  const id = b.dataset.id;
  const { error } = await SB.rpc('noter_salle', { p: { jour_id: Number(id), code: v('cal-code-' + id), mot_de_passe: v('cal-mdp-' + id) } });
  if (error) { toast(erreurRpc(error), true); return; }
  toast('Code de la salle enregistré : les membres actifs non suspendus le voient dans « Prochains événements ».'); afficherCalendrierAdmin();
};
ACTIONS['cal-decider'] = async b => {
  const d = b.dataset.d;
  const q = { reporter: 'Reporter ce match (carte manquante) ? La date suivante gardera sa carte. Motif (facultatif, « Carte manquante » par défaut) :', annuler: 'Annuler cette date ? Elle ne prend pas de carte ; la rotation continue au match suivant. Motif (facultatif, affiché aux membres) :' };
  let motif = null;
  if (q[d]) { motif = prompt(q[d]); if (motif === null) return; }
  const { error } = await SB.rpc('decider_jour', { p_jour: Number(b.dataset.id), p_decision: d, p_motif: motif || null });
  if (error) { toast(erreurRpc(error), true); return; }
  toast({ reporter: 'Match reporté : la date suivante garde sa carte.', annuler: 'Date annulée : la rotation continue au match suivant.', retablir: 'Date rétablie.' }[d]); afficherCalendrierAdmin();
};
ACTIONS['cal-saisir'] = b => { const j = CAL.find(x => String(x.id) === b.dataset.id); if (j) ouvrirMatch('', j); };
function lireEvenementForm(pre) {
  return { titre: v(pre + '-titre'), description: v(pre + '-desc') || null, debut: locISO(L.normDT(v(pre + '-debut'))), fin: v(pre + '-fin') ? locISO(L.normDT(v(pre + '-fin'))) : null };
}
function erreurEvenement(o) {
  if (!o.titre) return 'Le titre est obligatoire.';
  if (!o.debut) return 'La date et l’heure de début sont obligatoires.';
  if (o.fin && new Date(o.fin) <= new Date(o.debut)) return 'La fin doit suivre le début.';
  return '';
}
ACTIONS['evc-creer'] = async () => {
  const o = lireEvenementForm('evc'), e = erreurEvenement(o);
  if (e) { toast(e, true); return; }
  const { error } = await SB.from('evenements').insert(o);
  if (error) { toast('Création impossible : ' + error.message, true); return; }
  await SB.from('journal').insert({ type: 'Événement', objet: o.titre, decision: 'Événement communautaire créé' });
  ['evc-titre', 'evc-debut', 'evc-fin', 'evc-desc'].forEach(i => { $('#' + i).value = ''; });
  toast('Événement créé : les membres le voient dans « Prochains événements ».'); afficherCalendrierAdmin();
};
ACTIONS['evc-modifier'] = b => {
  const x = (UI.evc || []).find(e => String(e.id) === b.dataset.id); if (!x) return;
  modal('Modifier l’événement', '<label class="lab" for="eve-titre">Titre</label><input type="text" id="eve-titre" maxlength="100" value="' + esc(x.titre) + '">'
    + '<div class="grid-f"><div><label class="lab" for="eve-debut">Début</label><input type="datetime-local" id="eve-debut" value="' + esc(isoLoc(x.debut)) + '"></div><div><label class="lab" for="eve-fin">Fin (facultative)</label><input type="datetime-local" id="eve-fin" value="' + esc(isoLoc(x.fin)) + '"></div></div>'
    + '<label class="lab" for="eve-desc">Description</label><textarea id="eve-desc" rows="3">' + esc(x.description || '') + '</textarea><div id="a-err" class="err" role="alert"></div>',
    [{ label: 'Annuler', cls: 'ghost' }, { label: 'Enregistrer', onClick: async () => {
      const o = lireEvenementForm('eve'), e = erreurEvenement(o);
      if (e) return erreurA(e);
      o.modifie_le = new Date().toISOString();
      const { error } = await SB.from('evenements').update(o).eq('id', x.id);
      if (error) return erreurA('Enregistrement impossible : ' + error.message);
      toast('Événement modifié.'); afficherCalendrierAdmin(); return true;
    } }]);
};
ACTIONS['evc-retirer'] = async b => {
  if (!confirm('Retirer cet événement ? Les membres ne le verront plus.')) return;
  const { error } = await SB.from('evenements').update({ retire_le: new Date().toISOString() }).eq('id', Number(b.dataset.id));
  if (error) { toast('Impossible : ' + error.message, true); return; }
  toast('Événement retiré.'); afficherCalendrierAdmin();
};

async function demarrer() {
  $('#app').replaceChildren($('#tpl').content.cloneNode(true));
  try { PUB = JSON.parse($('#pub-data').textContent || 'null'); } catch (e) { PUB = null; }
  lierEvenements();
  router();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (SB) {
    const { data } = await SB.auth.getSession();
    await chargerParametres();
    try { await chargerPublic(); } catch (e) { console.warn('Classements illisibles :', e); }
    PRET = true;
    if (RECUP || RETOUR_LIEN.erreur) location.hash = '#compte';
    await majSession(data.session);
  } else PRET = true;
  rendreBandeau();
  router();
}
demarrer();
})();
</script>
</body>
</html>
