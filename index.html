<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEAGUE UV — Victory Unite (DFMM)</title>
<meta name="theme-color" content="#080A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icone-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&amp;display=swap">
<style id="app-style">/* VOICE work, with esport energy: the league's official office
   IDEA the end-of-match scoreboard of Delta Force, worn as a tactical HUD
   PICTURE the 11-distinction scoreboard beside the official DFMM logo
   COLOUR ground #080A0A, ink #FFFFFF, green #35D66F leads, red #E53935 for alerts, helmet greys
   TYPE Exo 2 italic 800 (from the logo lettering) + system sans for text
   LAYOUT laptop: logo and title left, scoreboard right; phone: logo, title, scoreboard stacked */
:root{color-scheme:dark;--bg:#080A0A;--bg2:#0B100E;--panel:#0F1513;--panel2:#141C19;--line:#1E2924;--line2:#2C3B34;--ink:#FFFFFF;--mute:#AAB5AF;--dim:#7B8781;--green:#35D66F;--green2:#27B15A;--greenbg:rgba(53,214,111,.10);--red:#E53935;--redbg:rgba(229,57,53,.13);--amber:#E53935;--amberbg:rgba(229,57,53,.07);--steel:#8C9692;--display:"Exo 2","Arial Narrow",system-ui,sans-serif;--text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);--plate:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--text);overflow-x:clip;-webkit-text-size-adjust:100%}
body.modal-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-style:italic;font-weight:800;line-height:1.05;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(34px,6vw,52px)}
h2{font-size:clamp(26px,3.6vw,34px)}
h3{font-size:20px}
p{margin:.5em 0}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto}
.band{padding-block:clamp(26px,4vw,56px);padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
.band.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mute{color:var(--mute)}
.dim{color:var(--dim)}
.small{font-size:14px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* En-tête */
.top{position:sticky;top:0;z-index:20;background:rgba(8,10,10,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(4vw,16px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:38px;height:auto;mix-blend-mode:lighten}
.brand b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;line-height:1;color:var(--ink)}
.brand small{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.saison-chip{font-size:13px;color:var(--mute);border:1px solid var(--line2);padding:4px 10px;white-space:nowrap;clip-path:var(--plate)}
.saison-chip b{color:var(--green);font-weight:600}
@media(max-width:520px){.brand small{display:none}.brand b{font-size:19px}.saison-chip{font-size:12px;padding:3px 8px}.nav a{font-size:14px;padding:8px 10px}.seg button{padding:6px 11px;min-height:38px}}
.nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(4vw,16px) 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;padding:8px 12px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-bottom-color:var(--green)}
.nav a.adm{color:var(--green)}
.banner{margin:12px max(4vw,16px) 0;padding:10px 14px;border:1px solid var(--line2);background:var(--panel);color:var(--mute);font-size:14px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:0;background:var(--green);color:#04110A;font-weight:700;text-decoration:none;cursor:pointer;clip-path:var(--cut);font-size:15px}
.btn:hover{background:#4BE583}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);clip-path:none}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--green);color:var(--green)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#F04B47}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lien{background:none;border:0;padding:0;color:var(--green);cursor:pointer;text-decoration:underline;font-size:inherit}

/* Accueil */
.hero{background:radial-gradient(1200px 500px at 15% 0%,rgba(53,214,111,.08),transparent 60%),var(--bg)}
.hero-grid{display:grid;gap:22px;max-width:1240px;margin:0 auto;grid-template-areas:"id" "board" "more"}
.hero-id{grid-area:id;display:flex;align-items:center;gap:16px}
.hero-more{grid-area:more;display:grid;gap:18px;align-content:start}
.board{grid-area:board}
.logo-full{width:132px;height:auto;mix-blend-mode:lighten;flex:none}
.hero-t{display:grid;gap:6px}
.hero-id .sous{font-family:var(--display);font-style:italic;font-weight:700;color:var(--green);font-size:18px;margin:0}
.lead{font-size:17px;color:var(--mute);max-width:60ch;margin:0}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.facts li{background:var(--panel);padding:12px 14px}
.facts b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;color:var(--green);line-height:1.1}
.facts span{font-size:14px;color:var(--mute)}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
@media(min-width:900px){
  .hero-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-areas:"id board" "more board";grid-template-rows:auto 1fr;gap:26px 44px;align-items:start}
  .hero-id{display:grid;gap:18px}
  .logo-full{width:250px}
  .hero-id .sous{font-size:20px}
}

/* Tableau des distinctions (scoreboard) */
.board{background:linear-gradient(180deg,#0E1512,#0A0F0D);border:1px solid var(--line2);position:relative}
.board::before,.board::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--green);pointer-events:none}
.board::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.board::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.board-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.board-h h2{font-size:24px}
.board-h p{margin:0;font-size:13px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;clip-path:var(--plate);background:var(--line2);color:var(--ink);white-space:nowrap}
.badge.g{background:var(--green);color:#04110A}
.badge.r{background:var(--red);color:#fff}
.badge.a{background:transparent;box-shadow:inset 0 0 0 1px var(--amber);color:#FF8A86;clip-path:none}
.badge.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--mute);clip-path:none}
.grp{padding:6px 16px 2px;font-size:13px;color:var(--green);font-weight:700;border-top:1px solid var(--line);background:rgba(53,214,111,.04)}
.grp:first-of-type{border-top:0}
.br{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.br .cat{font-weight:700;font-size:14px;line-height:1.2}
.br .cat small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.br .who{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.br .who small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.br .val{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;color:var(--green)}
.br.vide .who,.br.vide .val{color:var(--dim);font-weight:400;font-family:var(--text);font-style:normal;font-size:14px}
.board-f{padding:10px 16px;border-top:1px solid var(--line2);font-size:13px;color:var(--mute)}

/* Sections */
.sec-head{display:grid;gap:8px;margin-bottom:22px;max-width:900px}
.sec-head p{color:var(--mute);margin:0}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.step{background:var(--panel);border:1px solid var(--line);padding:16px}
.step h3{font-size:19px;margin-bottom:6px}
.step .n{font-family:var(--display);font-style:italic;font-weight:800;color:var(--green);font-size:15px}
.step p{margin:0;color:var(--mute);font-size:15px}
.dist{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dist .step ul{margin:8px 0 0;padding-left:18px;color:var(--ink)}
.dist .step li{margin:3px 0}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.panel h3{margin-bottom:8px}
.note{border-left:3px solid var(--green);background:var(--greenbg);padding:10px 14px;margin:14px 0;font-size:15px}
.note.r{border-left-color:var(--red);background:var(--redbg)}
.note.a{border-left-color:var(--amber);background:var(--amberbg)}
.cols2{display:grid;gap:14px}
@media(min-width:820px){.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Tableaux */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
tr.lead1 td{background:var(--greenbg)}
td.r{text-align:right}
@media(max-width:600px){table{font-size:14px}th,td{padding:7px 6px}}

/* Classements publics */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.seg button{border:1px solid var(--line2);background:transparent;padding:8px 14px;cursor:pointer;color:var(--mute);font-weight:600;min-height:40px}
.seg button.on{background:var(--green);border-color:var(--green);color:#04110A}
.cl-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.cl-card{background:var(--panel);border:1px solid var(--line)}
.cl-card header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line2)}
.cl-card h3{font-size:19px}
.cl-card .def{font-size:13px;color:var(--mute);margin:2px 0 0}
.cl-card table{font-size:14px}
.rk{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 4px;font-family:var(--display);font-style:italic;font-weight:800;font-size:14px;background:var(--line2);clip-path:var(--plate)}
tr.lead1 .rk{background:var(--green);color:#04110A}
.vide-cl{padding:28px 16px;text-align:center;color:var(--mute)}

/* Règlement */
.regl{display:grid;gap:24px;max-width:1240px;margin:0 auto}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:6px 10px;font-size:14px;cursor:pointer;text-align:left}
.toc button:hover{color:var(--ink);border-color:var(--green)}
@media(min-width:1000px){.regl{grid-template-columns:250px minmax(0,1fr)}.toc{position:sticky;top:110px;flex-direction:column;align-self:start}.toc button{border:0;border-left:2px solid var(--line);background:none}}
.chap{scroll-margin-top:110px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:24px}
.chap h2{font-size:26px;margin-bottom:10px}
.chap h2 .cn{color:var(--green);margin-right:8px}
.chap h3{font-size:18px;margin:16px 0 6px}
.chap ul,.chap ol{padding-left:20px;margin:6px 0}
.chap li{margin:4px 0}
.chap p,.chap li{max-width:75ch}
.chg{font-size:12px;font-weight:700;color:#04110A;background:var(--green);padding:1px 6px;margin-left:6px;vertical-align:2px;clip-path:var(--plate);white-space:nowrap}

/* Processus */
.flows{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.flow{background:var(--panel);border:1px solid var(--line);padding:16px}
.flow h3{margin-bottom:4px}
.flow > p{color:var(--mute);margin:0 0 10px;font-size:15px}
.rail{list-style:none;margin:0;padding:0;position:relative}
.rail li{position:relative;padding:0 0 12px 30px}
.rail li::before{content:"";position:absolute;left:7px;top:8px;width:10px;height:10px;background:var(--green);clip-path:var(--plate)}
.rail li::after{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line2)}
.rail li:last-child::after{display:none}
.rail li b{display:block}
.rail li span{color:var(--mute);font-size:15px}
.rail li.stop::before{background:var(--red)}

/* Formulaires */
label.lab{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px;font-weight:600}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=datetime-local],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;min-height:44px;background:#090D0C;border:1px solid var(--line2);padding:9px 11px;font-size:16px;border-radius:0;color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix label{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:9px 12px;cursor:pointer;min-height:44px}
.choix label:has(input:checked){border-color:var(--green);background:var(--greenbg)}
.coche{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.coche input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
input[type=radio]{accent-color:var(--green);width:18px;height:18px}
.grid-f{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.err{color:#FF8A86;font-size:14px;margin-top:4px}
.msg-out{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;min-height:220px}

/* Administration */
.adm-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.adm-tabs a{flex:none;text-decoration:none;color:var(--mute);border:1px solid var(--line2);padding:7px 12px;font-size:14px;font-weight:600}
.adm-tabs a.on{background:var(--green);border-color:var(--green);color:#04110A}
.adm-tabs a .cpt{display:inline-block;min-width:20px;margin-left:6px;padding:0 5px;background:var(--red);color:#fff;font-size:12px;text-align:center}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:12px}
.kpi b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;color:var(--green);line-height:1.1}
.kpi span{font-size:13px;color:var(--mute)}
.taches{list-style:none;margin:0;padding:0}
.taches li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-l{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-bottom:10px}
.card-l .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.card-l .t b{font-size:17px}
.chk{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.chk li{padding:3px 0 3px 24px;position:relative}
.chk li::before{position:absolute;left:0;font-weight:800}
.chk li.b{color:#FF8A86}.chk li.b::before{content:"✕";color:var(--red)}
.chk li.w{color:var(--ink)}.chk li.w::before{content:"!";color:var(--amber);left:6px}
.chk li.o{color:var(--mute)}.chk li.o::before{content:"✓";color:var(--green)}
.chk li.s{color:var(--mute)}.chk li.s::before{content:"–";color:var(--mute);left:4px}
.chk.crit li.o{color:var(--ink)}
.kv{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 12px;font-size:15px;margin:6px 0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;overflow-wrap:anywhere}
.code-salle{font-size:20px;letter-spacing:.06em;font-family:ui-monospace,Menlo,Consolas,monospace}
.lignes-t input,.lignes-t select{min-height:38px;padding:5px 6px;font-size:16px}
.lignes-t input[type=number]{width:74px}
.lignes-t td{padding:4px 4px;vertical-align:middle}
.lignes-t .ps{min-width:150px}
.lignes-t select[data-f=faction]{min-width:98px}
.res{font-size:13px;white-space:nowrap}
.res.auto{color:var(--green)}
.res.aid{color:var(--amber);font-weight:700}
.res.ni{color:var(--dim)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs a img{width:90px;height:90px;object-fit:cover;border:1px solid var(--line2)}
.ctrl-box{background:var(--panel2);border:1px solid var(--line2);padding:10px 12px;margin-top:8px}

/* Modale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.modal-c{background:var(--bg2);border:1px solid var(--line2);width:min(820px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal.large .modal-c{width:min(1180px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.modal-h h3{font-size:20px}
.modal-x{background:none;border:0;color:var(--mute);font-size:28px;line-height:1;cursor:pointer;min-width:44px;min-height:44px}
.modal-b{padding:4px 16px 16px;overflow:auto}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line2)}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--green);padding:10px 16px;max-width:min(92vw,560px);font-size:15px}
.toast.err{border-color:var(--red)}

.foot{border-top:1px solid var(--line);padding:22px max(4vw,16px) 30px;color:var(--dim);font-size:14px;display:grid;gap:6px}
.foot b{color:var(--mute)}

/* Lot socle : connexion et version de test */
input[type=password]{width:100%;min-height:44px;background:#090D0C;border:1px solid var(--line2);padding:9px 11px;font-size:16px;border-radius:0;color:var(--ink)}
.banner.test{border-color:var(--red);background:var(--redbg);color:var(--ink)}
.nav a .cpt{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;background:var(--red);color:#fff;font-size:12px;text-align:center;border-radius:9px}
.notif-nouv{border-left:3px solid var(--red);padding-left:8px}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><header class="top">

          <h1>LEAGUE UV</h1>
          <p class="sous">Victory Unite, saison après saison</p>

      <div class="hero-more">
        <p class="lead">La ligue communautaire et individuelle des joueurs malgaches de Delta Force Mobile. Chaque match validé compte, et chaque contribution peut être reconnue sur la saison.</p>
        <ul class="facts">
          <li><b>Mer. et sam.</b><span>matchs de Katana à 16 h</span></li>
          <li><b>14 jours</b><span>entre deux classements provisoires</span></li>
          <li><b>11</b><span>distinctions par saison</span></li>
          <li><b>8</b><span>statistiques suivies par match</span></li>
        </ul>

  <div class="band alt">
    <div class="wrap">
      <div class="sec-head"><h2>Comment ça marche</h2><p>La ligue suit vos performances individuelles sur toute la saison, à partir des captures de fin de match.</p></div>
      <div class="steps">
        <div class="step"><span class="n">Étape 1</span><h3>S’inscrire</h3><p>Formulaire d’inscription, puis vérification par l’organisation. Vous recevez un matricule permanent DFMM-n.</p></div>
        <div class="step"><span class="n">Étape 2</span><h3>Jouer</h3><p>Matchs de Katana, chaque mercredi et chaque samedi à 16 h 05, ou matchs libres déclarés au moins 2 h à l’avance (ouverts au lancement).</p></div>
        <div class="step"><span class="n">Étape 3</span><h3>Prouver</h3><p>La capture du résultat de fin de match est contrôlée, puis validée manuellement par l’organisation.</p></div>
        <div class="step"><span class="n">Étape 4</span><h3>Être classé</h3><p>Classement provisoire un dimanche sur deux, classement final le dimanche qui suit les 48 h de vérification de fin de saison.</p></div>
      </div>
    </div>
  </div>

  <div class="band">
    <div class="wrap">
      <div class="sec-head"><h2>Les 11 distinctions</h2><p>Plusieurs façons d’être reconnu : l’assiduité, la qualité et la capacité à rester en vie tout en contribuant.</p></div>
      <div class="dist">
        <div class="step"><span class="n">5 titres</span><h3>MOST, le total de la saison</h3><p>Récompense l’assiduité et la persévérance : chacun peut gagner en jouant régulièrement.</p><ul><li>MOST Eliminator</li><li>MOST Medic</li><li>MOST Engineer</li><li>MOST Objective</li><li>MOST Tactician</li></ul></div>
        <div class="step"><span class="n">5 titres</span><h3>BEST, la moyenne par match</h3><p>Récompense la qualité, à condition d’avoir joué au moins le nombre médian de matchs.</p><ul><li>BEST Eliminator</li><li>BEST Medic</li><li>BEST Engineer</li><li>BEST Objective</li><li>BEST Tactician</li></ul></div>
        <div class="step"><span class="n">1 titre</span><h3>BEST Survivor</h3><p>La moyenne de morts par match la plus faible, avec un minimum de matchs et un score moyen au moins égal au premier quartile.</p></div>
      </div>
    </div>
  </div>

        <h2>Nos principes</h2>
        <ul class="chk" style="font-size:16px;margin-top:14px">
          <li class="o">Équité : les mêmes règles de calcul pour tous, publiées à l’avance.</li>
          <li class="o">Transparence : classements provisoires réguliers et droit de réclamation sous 48 h.</li>
          <li class="o">Intégrité : un seul matricule par personne, un seul compte actif, des preuves vérifiées.</li>
          <li class="o">Aucun tirage au sort, aucune attribution arbitraire. En cas d’égalité parfaite : co-lauréats, titre partagé.</li>
        </ul>
        <p class="mute small">La LEAGUE UV est une compétition communautaire organisée par DFMM, indépendante de l’éditeur du jeu : elle n’est ni organisée ni certifiée par lui.</p>
      </div>
    </div>
  </div>
</section>

      <div>
        <article class="chap" id="r-principes">
          <h2>Principes</h2>
          <p>La LEAGUE UV est une compétition communautaire individuelle et saisonnière de DFMM (DELTA FORCE MOBILE MADAGASCAR), organisée autour du mode Victory Unite (Warfare) de Delta Force Mobile Global. Elle reconnaît les performances sur la durée, dans un cadre vérifiable et équitable.</p>
          <ul>
            <li>Une personne = un matricule = un seul compte actif à la fois.</li>
            <li>8 statistiques suivies, 11 distinctions, 1 lot matériel au maximum par joueur.</li>
            <li>Le <b>lauréat sportif</b> garde le titre de sa catégorie. Le <b>bénéficiaire matériel</b> reçoit éventuellement le lot, selon l’ordre de priorité et la règle d’un seul lot par joueur.</li>
            <li>Aucun tirage au sort, aucune attribution arbitraire. Égalité parfaite : co-lauréats, titre partagé.</li>
            <li>Initiative indépendante : ce règlement n’est pas celui de l’éditeur du jeu.</li>
          </ul>
        </article>

        <article class="chap" id="r-elig">
          <h2><span class="cn">1</span>Éligibilité et inscription</h2>
          <h3>Conditions</h3>
          <ul>
            <li>Être de nationalité malgache ou d’origine malgache (déclaration à l’inscription, vérifiée par l’organisation lors de l’approbation).</li>
            <li>Comprendre le malgache : <b>critère essentiel</b>.<span class="chg">Mis à jour</span></li>
            <li>Parler le malgache : information demandée, non bloquante (le créole est accepté).</li>
            <li>Un joueur malgache vivant à l’étranger peut participer s’il remplit ces critères. Résider à Madagascar ne suffit pas à lui seul.</li>
          </ul>
          <div class="scroll"><table>
            <thead><tr><th>Situation</th><th>Décision de principe</th></tr></thead>
            <tbody>
              <tr><td>Joueur malgache vivant à Madagascar, qui comprend le malgache</td><td>Admissible, sous réserve des contrôles</td></tr>
              <tr><td>Joueur malgache vivant à l’étranger, qui comprend le malgache</td><td>Admissible, sous réserve des contrôles</td></tr>
              <tr><td>Joueur non malgache résidant à Madagascar</td><td>Non admissible sur le seul critère de résidence</td></tr>
              <tr><td>Joueur d’origine malgache qui ne comprend pas le malgache</td><td>Ne remplit pas le critère linguistique</td></tr>
            </tbody>
          </table></div>
          <h3>Informations demandées</h3>
          <p>Nom et prénom réels, nom de gamer dans la communauté, e-mail (obligatoire), date de naissance, genre (homme, femme ou préfère ne pas le dire), lien Facebook, clan (facultatif), pseudo exact en jeu, UID Delta Force, capture du profil de jeu montrant le pseudo et l’UID, lieu de résidence (à Madagascar : province puis ville principale ou périphérie ; à l’étranger : pays), compréhension et pratique du malgache, déclaration de nationalité ou d’origine malgache, acceptation des règlements DFMM et LEAGUE UV, du traitement des données et de l’approbation de l’inscription.</p>
          <h3>Parcours</h3>
          <p>Envoi des informations, vérification automatique à l’envoi (UID existant dans Delta Force, pseudo lu sur le profil officiel, adresse e-mail réelle : les adresses temporaires sont refusées), envoi d’un code personnel à la <a href="https://www.facebook.com/profile.php?id=61596920126729" target="_blank" rel="noopener">page DFMM</a> sur Messenger, depuis le compte Facebook indiqué, vérification par l’organisation (dossier complet, UID unique, pseudo et UID contrôlés sur la capture du profil, code Messenger reçu, critères d’éligibilité), décision de l’organisation, attribution du matricule et enregistrement du compte, puis message de confirmation. Si le pseudo lu sur le profil diffère du pseudo déclaré, c’est le pseudo du profil qui est enregistré.<span class="chg">Mis à jour</span> Chaque inscription est validée manuellement. L’inscription donne accès aux activités réservées aux membres ; certaines activités restent publiques.</p>
        </article>

        <article class="chap" id="r-mat">
          <h2><span class="cn">2</span>Matricule, comptes et pseudo</h2>
          <h3>Matricule</h3>
          <ul>
            <li>Format DFMM-1, DFMM-2, DFMM-3… attribué automatiquement à l’approbation.</li>
            <li>Permanent : il suit la personne pendant toutes les saisons. Un numéro n’est jamais réutilisé, même après un retrait ou une exclusion.</li>
            <li>Membres déjà approuvés (DFMM-1 à DFMM-25) : en se réinscrivant sur le site, ils <b>gardent leur matricule</b> et leur date d’approbation d’origine. Les nouveaux membres commencent à DFMM-26.<span class="chg">Mis à jour</span></li>
          </ul>
          <h3>Comptes de jeu</h3>
          <ul>
            <li>Au maximum <b>2 comptes</b> Delta Force enregistrés par matricule, et <b>un seul actif</b> à la fois. Seul le compte actif est comptabilisé.<span class="chg">Mis à jour</span></li>
            <li>Ajouter un 2e compte : demande avec le pseudo, l’UID, une capture du profil et un motif. Contrôles : 2 comptes au maximum, UID inconnu des autres membres. Le 2e compte peut devenir actif tout de suite.</li>
            <li>Changer de compte actif : demande avec un motif court. Il faut au moins <b>7 jours</b> entre deux changements.</li>
            <li>Compte perdu ou inaccessible : il est marqué « Remplacé » définitivement. Les statistiques restent attachées au matricule.</li>
            <li>Ajout et changement de compte actif passent par l’accord de l’organisation. Un compte non reconnu n’est pas comptabilisé.</li>
            <li>Un changement de compte ne peut jamais servir à éviter une sanction, une restriction ou un mauvais résultat.</li>
          </ul>
          <h3>Pseudo</h3>
          <ul>
            <li>Un changement de pseudo est une simple <b>déclaration</b>, sans approbation, à faire avant la participation suivante.<span class="chg">Mis à jour</span></li>
            <li>L’historique des pseudos est conservé. Le pseudo lu sur une capture est rattaché au bon compte selon la date du match.</li>
          </ul>
        </article>

        <article class="chap" id="r-statut">
          <h2><span class="cn">3</span>Statut de membre et périodes</h2>
          <ul>
            <li><b>Actif</b> : membre approuvé, ses matchs comptent.</li>
            <li><b>Suspendu</b> : sanction temporaire, avec une date de fin. Il reste membre, mais ses matchs ne comptent pas pendant la suspension.</li>
            <li><b>Retiré</b> : départ volontaire, automatique, sauf si un litige, un match en attente ou une sanction est en cours (Katana décide alors).</li>
            <li><b>Exclu</b> : sanction définitive, pour des faits graves ou répétés.</li>
          </ul>
          <p>Un membre ne change jamais lui-même son statut : il adresse une demande à l’organisation, qui l’accepte ou la refuse.</p>
          <h3>Règle de comptabilisation</h3>
          <p>Un match compte pour un joueur seulement s’il s’est terminé pendant une période où le membre et son compte étaient actifs. Les matchs joués avant l’approbation, ou pendant un retrait, une suspension ou une exclusion, ne comptent pas.<span class="chg">Nouveau</span></p>
          <h3>Retrait et réintégration</h3>
          <ul>
            <li>Demande de retrait avec motif facultatif. Si elle est acceptée, la période active se ferme, les comptes deviennent inactifs et les autres demandes en cours sont annulées.</li>
            <li>Le matricule, les statistiques et le pseudo sont conservés, mais un membre retiré n’apparaît plus dans les classements et ne reçoit aucun lot.</li>
            <li>Réintégration possible à tout moment avec l’accord de l’organisation : même matricule et même historique, nouvelle période à partir de la date d’accord.</li>
          </ul>
          <h3>Effacement des données</h3>
          <p>Sur demande, les informations personnelles (e-mail, date de naissance, nom réel, lien Facebook, etc.) sont effacées. Le matricule, les statistiques et le pseudo de jeu sont conservés, et les apparitions passées dans les classements et résultats officiels restent publiques avec le pseudo.</p>
        </article>

        <article class="chap" id="r-matchs">
          <h2><span class="cn">4</span>Matchs de Katana et matchs libres</h2>
          <p>Tous les matchs valides ont la même valeur pour les classements. Chaque match garde une étiquette « Katana » ou « libre ».</p>
          <h3>Matchs de Katana</h3>
          <ul>
            <li><b>Calendrier</b> : chaque mercredi et chaque samedi, début à <b>16 h 05</b> (salle ouverte vers 15 h 50). Étiquette « Katana ». Sa seule capture suffit.<span class="chg">Mis à jour</span></li>
            <li><b>Cartes</b> : rotation fixe, en boucle, dans cet ordre : Craqué, Ascension, Ligne de tranchées, Accident de train, Canal d’Akh, Faille. La carte de chaque match est affichée dans « Prochains événements ».<span class="chg">Nouveau</span></li>
            <li><b>Carte manquante</b> : si la carte manque chez des joueurs et que le jeu bloque le démarrage, le match est reporté au jour de match suivant. Il garde sa carte, et la rotation reprend après lui.<span class="chg">Nouveau</span></li>
            <li><b>Date annulée</b> : Katana peut annuler une date. Elle ne prend pas de carte : la rotation continue au match suivant.<span class="chg">Nouveau</span></li>
            <li>Salon personnalisé du mode Victory Unite, rejoint par code. Chat écrit uniquement, sans micro.</li>
            <li>Les consignes de salon (escouades, capitaines…) sont un simple rappel. <b>Aucun nombre maximum de participants.</b> Aucune condition de grade.<span class="chg">Mis à jour</span></li>
          </ul>
          <h3>Matchs libres</h3>
          <ul>
            <li>Organisés par les joueurs, déclarés <b>au moins 2 h avant</b> : date et heure de début, responsables HAAVK et GTI, motif facultatif. Le match est enregistré automatiquement ; Katana est averti et peut l’annuler.<span class="chg">Mis à jour</span></li>
            <li><b>Fermés jusqu’au lancement</b> de la LEAGUE UV : d’ici là, seuls les matchs de Katana comptent (« saisie de démarrage »).</li>
            <li>Un seul match est comptabilisé par créneau déclaré.</li>
            <li><b>Carte</b> : hors rotation, au libre choix de l’organisateur parmi toutes les cartes disponibles dans le mode.<span class="chg">Nouveau</span></li>
            <li>Un organisateur et un responsable par faction. Chaque responsable envoie sa capture par le site ; l’organisateur aussi s’il n’est pas responsable. Les captures doivent concorder, sinon le match est mis en attente.</li>
            <li>La capture doit être envoyée au plus <b>10 minutes</b> après l’heure de fin affichée, selon l’heure d’envoi enregistrée par le site.<span class="chg">Mis à jour</span></li>
            <li><b>Matricule non autorisé</b> : si un matricule déclaré comme organisateur ou responsable n’est pas autorisé pour la saison, la déclaration est retenue et Katana est averti. Le message affiché reste neutre.<span class="chg">Nouveau</span></li>
          </ul>
          <h3>Code et mot de passe de la salle</h3>
          <ul>
            <li>Saisis, et modifiables, par l’organisateur du match (Katana pour ses matchs, l’organisateur pour un match libre), vers la création de la salle, environ 15 minutes avant le début.<span class="chg">Nouveau</span></li>
            <li>Visibles dans « Prochains événements » (rubrique réservée aux membres connectés), seulement par les <b>membres actifs non suspendus</b>.</li>
            <li>Le site ne donne aucun moyen aux joueurs non inscrits d’obtenir le code. Chaque organisateur est responsable de l’endroit où il fait suivre le code.</li>
            <li><b>Interdit</b> : partager le code ou le mot de passe hors du lieu prévu, c’est-à-dire ailleurs que sur le site ou à l’endroit choisi par l’organisateur pour faire suivre le code (par exemple dans la discussion mondiale du jeu). Voir la section 11.</li>
            <li><b>« Je participe »</b> : pour le prochain match, chaque membre peut indiquer qu’il participe. Le nombre est visible par tous ; les noms, seulement par Katana et l’organisateur.</li>
          </ul>
          <h3>Phase de démarrage</h3>
          <p>Avant le lancement de la LEAGUE UV, seuls les matchs de Katana comptent. Ils sont saisis avec sa seule capture, sans délai de 10 minutes (« saisie de démarrage »). Les autres règles s’appliquent.<span class="chg">Nouveau</span></p>
        </article>

        <article class="chap" id="r-valid">
          <h2><span class="cn">5</span>Validité d’un match et preuves</h2>
          <h3>Conditions de validité</h3>
          <ul>
            <li>Au moins <b>16 participants</b> (8 contre 8).<span class="chg">Mis à jour</span></li>
            <li>Factions HAAVK et GTI équilibrées : même effectif ou un joueur d’écart au maximum, compté sur tous les participants de la capture (inscrits ou non). Au-delà, le match est invalidé. <b>Jamais plus d’un joueur d’écart, sans exception.</b><span class="chg">Mis à jour</span></li>
            <li>Au moins <b>50 % de membres confirmés</b> parmi les participants, arrondi vers le bas (16 participants : 8 membres au minimum).<span class="chg">Mis à jour</span></li>
            <li>Les joueurs non inscrits ne bloquent pas le match, mais seuls les membres inscrits reçoivent des points.</li>
            <li>Un joueur ne participe qu’une seule fois au même match, y compris avec deux comptes.</li>
            <li>Le match doit se terminer pendant la saison, au plus tard à sa fin officielle dans le jeu.</li>
            <li><b>Retard</b> : pour tous les matchs (de Katana et libres), l’heure de fin doit tomber entre l’heure de début annoncée et <b>1 h après</b>. Sinon, le match n’est pas validé.<span class="chg">Nouveau</span></li>
            <li><b>Joueur parti pendant le match</b> (en gris en bas du tableau de la capture) : il est toujours compté dans l’effectif et dans l’écart des factions.<span class="chg">Nouveau</span></li>
          </ul>
          <h3>Preuves et validation</h3>
          <ul>
            <li>La preuve principale est la capture du résultat de fin de match : carte, mode, date et heure de fin, pseudos et 8 statistiques. Au-delà de 8 joueurs par faction, il faut deux captures (haut, puis bas de la liste).</li>
            <li>Contrôles automatiques : valeurs manquantes, négatives ou en double, effectif, équilibre des factions, part de membres inscrits et délai d’envoi.</li>
            <li>Pseudo ambigu ou incertain : la ligne est marquée « à identifier » et l’organisation choisit le bon compte. Les lignes sûres comptent ; une ligne identifiée après coup ne compte que pour les classements suivants.</li>
            <li>Chaque match est vu et confirmé par l’organisation avant de compter. Une déclaration orale ou une capture isolée et contestée ne suffit pas.</li>
            <li>Une déconnexion ou un abandon n’efface pas automatiquement les statistiques déjà acquises : la validité générale du match est examinée.</li>
            <li>Un match invalidé est retiré pour tous ses participants, sans sanction individuelle automatique.</li>
            <li>La date d’une capture peut être falsifiée : l’organisation peut refuser un match suspect.</li>
            <li><b>Lisibilité</b> : une capture floue ou partiellement illisible n’est jamais acceptée. Si plusieurs captures sont complètes et lisibles, la plus visible est retenue, sans mélange entre captures.<span class="chg">Nouveau</span></li>
            <li><b>Aucune capture valable à temps</b> : le match est refusé. Il est gardé avec son motif, mais il ne compte pas.</li>
            <li><b>Concordance</b> : plusieurs captures doivent montrer les mêmes pseudos, les mêmes statistiques par joueur, la même carte, avec une victoire d’un côté et une défaite de l’autre. Sinon, le match est mis en attente.</li>
            <li><b>Compte inactif</b> : la ligne ne compte pas, et le joueur reçoit une simple notification.</li>
            <li><b>Temps de jeu</b> : il n’est pas mesuré ; seul compte le résultat final de la capture.</li>
          </ul>
        </article>

        <article class="chap" id="r-attente">
          <h2><span class="cn">6</span>Matchs en attente et litiges</h2>
          <p>Un match qui ne peut pas être validé automatiquement est <b>mis en attente</b>. Katana le tranche dans les <b>48 heures</b> qui suivent la fin du match.<span class="chg">Nouveau</span></p>
          <ul>
            <li>Un dossier s’ouvre dans le site, avec une discussion réservée à Katana et aux personnes convoquées. Elle a lieu uniquement dans le site, et les échanges ne sont pas simultanés.</li>
            <li>Katana convoque les responsables et l’organisateur, et des témoins des deux factions si besoin. Chaque personne convoquée <b>confirme la réception sous 12 heures</b> et reste disponible.</li>
            <li>Katana décide : vraie capture retenue, match refusé ou match annulé. <b>La discussion est alors fermée.</b></li>
            <li>Une synthèse du dossier est validée par Katana, puis archivée. Seule la vraie capture est conservée.</li>
            <li>Un match tranché après la coupure d’un samedi compte pour le classement provisoire suivant.</li>
          </ul>
          <p><b>Litige ou non</b> : une capture contradictoire ou falsifiée est un litige. Un écart de pseudo ou un compte inactif n’en est pas un : c’est une simple notification.</p>
        </article>

        <article class="chap" id="r-stats">
          <h2><span class="cn">7</span>Statistiques et distinctions</h2>
          <div class="scroll"><table>
            <thead><tr><th>N°</th><th>Statistique</th><th>Utilisation</th></tr></thead>
            <tbody>
              <tr><td>1</td><td>Score du match</td><td>Départages et conditions de BEST Survivor</td></tr>
              <tr><td>2</td><td>Éliminations</td><td>Catégorie Eliminator</td></tr>
              <tr><td>3</td><td>Morts</td><td>Statistique centrale de BEST Survivor</td></tr>
              <tr><td>4</td><td>Assistances</td><td>Suivie, sans distinction propre</td></tr>
              <tr><td>5</td><td>Contribution médicale</td><td>Catégorie Medic</td></tr>
              <tr><td>6</td><td>Contribution ingénieur</td><td>Catégorie Engineer</td></tr>
              <tr><td>7</td><td>Contribution aux objectifs</td><td>Catégorie Objective</td></tr>
              <tr><td>8</td><td>Contribution tactique</td><td>Catégorie Tactician</td></tr>
            </tbody>
          </table></div>
          <p class="mute small">Un zéro confirmé est une valeur valide. Les médailles ou badges affichés sur l’écran de résultat ne sont pas des statistiques supplémentaires.</p>
          <h3>MOST : performance cumulée</h3>
          <p>Total de la statistique sur tous les matchs valides du joueur. Le total le plus élevé est classé premier. Exemple : A totalise 42 éliminations en 6 matchs, B en totalise 42 en 8 matchs : B est devant.</p>
          <h3>BEST : moyenne par match</h3>
          <p>Moyenne = total de la statistique ÷ nombre de matchs valides. Les matchs à zéro restent dans le calcul. Pour être classé, il faut avoir joué au moins le <b>seuil</b> : la médiane du nombre de matchs des joueurs ayant au moins un match valide, arrondie à l’entier supérieur. Exemple : avec 3, 4, 4, 5 et 8 matchs, la médiane est 4, le seuil est donc 4 ; une médiane de 4,2 donnerait un seuil de 5.</p>
          <h3>BEST Survivor</h3>
          <p>Deux conditions : avoir joué au moins le seuil, et avoir une moyenne de score au moins égale au premier quartile (Q1) des moyennes de score de <b>tous</b> les joueurs ayant au moins un match valide, y compris ceux sous le seuil. Parmi les joueurs éligibles, la moyenne de morts par match la plus faible l’emporte.</p>
        </article>

        <article class="chap" id="r-dep">
          <h2><span class="cn">8</span>Départages et égalités</h2>
          <div class="scroll"><table>
            <thead><tr><th>Distinction</th><th>Critère principal</th><th>2e critère</th><th>3e critère</th></tr></thead>
            <tbody>
              <tr><td>MOST</td><td>Total le plus élevé</td><td>Plus de matchs joués</td><td>Score total le plus élevé</td></tr>
              <tr><td>BEST</td><td>Moyenne exacte la plus élevée</td><td>Plus de matchs joués</td><td>Score total le plus élevé</td></tr>
              <tr><td>BEST Survivor</td><td>Moyenne de morts la plus faible</td><td>Plus de matchs joués</td><td>Score total le plus élevé</td></tr>
            </tbody>
          </table></div>
          <ul>
            <li>Si les trois critères laissent une égalité parfaite : <b>co-lauréats, titre partagé</b>, et le lot de la catégorie n’est pas attribué. Jamais de tirage au sort ni de critère inventé après la clôture.<span class="chg">Mis à jour</span></li>
            <li>Les valeurs exactes sont comparées. Les arrondis servent seulement à l’affichage.</li>
          </ul>
        </article>

        <article class="chap" id="r-cal">
          <h2><span class="cn">9</span>Calendrier, publication et réclamations</h2>
          <ul>
            <li>Classement provisoire publié le <b>dimanche, tous les 14 jours</b>.<span class="chg">Confirmé</span></li>
            <li>Coupure le <b>samedi à 16 h</b>, selon l’<b>heure d’envoi</b> de la capture : envoyée avant 16 h, elle compte pour le provisoire du lendemain, même validée après ; sinon pour le suivant. Seul le match de Katana compte encore à 16 h ou après. Un match en attente tranché ou une ligne identifiée après la coupure compte pour le classement suivant.<span class="chg">Mis à jour</span></li>
            <li>Les matchs comptent jusqu’à la fin officielle de la saison du jeu, sans gel avant la fin. Puis <b>vérification pendant 48 h</b>, et classement final publié le dimanche qui suit.<span class="chg">Mis à jour</span></li>
            <li>Réclamation en privé dans les <b>48 heures</b> suivant la publication ou la notification, en indiquant le match concerné, le motif et les preuves.</li>
            <li>Les classements provisoires sont toujours distingués des résultats finaux.</li>
          </ul>
        </article>

        <article class="chap" id="r-lots">
          <h2><span class="cn">10</span>Récompenses et redistribution</h2>
          <ul>
            <li>Un joueur peut remporter plusieurs titres, mais ne reçoit qu’<b>un seul lot matériel</b> sur toute la distribution. Il ne choisit pas la distinction à laquelle son lot est rattaché.</li>
            <li>Les lots dépendent des moyens et des partenaires réellement confirmés. Aucun lot n’est annoncé avant confirmation.</li>
          </ul>
          <h3>Ordre obligatoire de priorité</h3>
          <div class="scroll"><table>
            <thead><tr><th>Ordre</th><th>Distinction</th><th>Ordre</th><th>Distinction</th></tr></thead>
            <tbody>
              <tr><td>1</td><td>MOST Eliminator</td><td>7</td><td>BEST Eliminator</td></tr>
              <tr><td>2</td><td>MOST Medic</td><td>8</td><td>BEST Medic</td></tr>
              <tr><td>3</td><td>MOST Engineer</td><td>9</td><td>BEST Engineer</td></tr>
              <tr><td>4</td><td>MOST Objective</td><td>10</td><td>BEST Objective</td></tr>
              <tr><td>5</td><td>MOST Tactician</td><td>11</td><td>BEST Tactician</td></tr>
              <tr><td>6</td><td>BEST Survivor</td><td></td><td></td></tr>
            </tbody>
          </table></div>
          <h3>Redistribution</h3>
          <ul>
            <li>Pour chaque catégorie, on part du lauréat sportif. S’il a déjà reçu un lot, le lot passe au joueur suivant éligible de cette catégorie qui n’a encore rien reçu.</li>
            <li>Le bénéficiaire reçoit le lot mais ne devient pas lauréat : le titre reste au lauréat sportif.</li>
            <li>Si aucun bénéficiaire unique ne peut être déterminé, ou si tous les éligibles ont déjà un lot, le lot reste non attribué.</li>
          </ul>
        </article>

        <article class="chap" id="r-sanc">
          <h2><span class="cn">11</span>Intégrité et sanctions</h2>
          <h3>Comportements interdits</h3>
          <ul>
            <li>Utiliser plusieurs comptes pour cumuler des statistiques ou occuper plusieurs places dans un match.</li>
            <li>Partager ou manipuler des comptes pour fausser l’identité ou les résultats.</li>
            <li>Organiser du farming d’éliminations, d’assistances ou de réanimations, ou s’entendre pour manipuler un match.</li>
            <li>Falsifier ou recadrer une capture de façon trompeuse, ou transmettre des captures contradictoires.</li>
            <li>Fournir une fausse identité, un pseudo ou un UID incorrect, ou contourner une sanction.</li>
            <li>Partager le code ou le mot de passe d’une salle hors du lieu prévu.<span class="chg">Nouveau</span></li>
            <li>Avoir un comportement toxique envers les autres joueurs.</li>
          </ul>
          <h3>Tableau-guide des sanctions</h3>
          <p>Le tableau est un <b>guide</b> : Katana décide au cas par cas, avec ou sans avertissement préalable.<span class="chg">Nouveau</span></p>
          <div class="scroll"><table>
            <thead><tr><th>Situation</th><th>Sanction</th></tr></thead>
            <tbody>
              <tr><td>Comportement toxique prouvé, première fois</td><td>Avertissement</td></tr>
              <tr><td>Comportement toxique répété</td><td>Suspension, 14 jours au plus</td></tr>
              <tr><td>Capture falsifiée</td><td>Suspension du fraudeur ; il ne peut plus être organisateur ni responsable pendant la saison ; le match compte si le vrai résultat est retrouvé, sinon il est annulé pour tous</td></tr>
              <tr><td>Deux comptes d’une même personne dans un match, ou compte prêté</td><td>Suspension ; le match reste valide, seules les statistiques de cette personne ne comptent pas</td></tr>
              <tr><td>Compte d’un ami inscrit comme le sien</td><td>Suspension, compte retiré</td></tr>
              <tr><td>Fausse identité</td><td>Compte supprimé, accès fermé, données gardées en privé pour enquête</td></tr>
              <tr><td>Double inscription, ou nouveau matricule pour contourner une sanction</td><td>Les deux comptes supprimés, bannissement</td></tr>
              <tr><td>Farming ou entente pour manipuler un match</td><td>Exclusion</td></tr>
              <tr><td>Récidive après une suspension</td><td>Exclusion</td></tr>
              <tr><td>Divulgation d’un litige : première fois / répétée / nuisant gravement à une personne</td><td>Avertissement / suspension de 14 jours au plus / exclusion</td></tr>
              <tr><td>Partage du code ou du mot de passe d’une salle hors du lieu prévu : première fois / récidive</td><td>Avertissement / suspension, durée fixée par Katana (14 jours au plus)</td></tr>
              <tr><td>Compte inactif utilisé, ou écart de pseudo</td><td>Pas de sanction, simple notification</td></tr>
            </tbody>
          </table></div>
          <p class="small">La règle sur le partage du code ou du mot de passe d’une salle s’applique à partir de sa publication sur le site.</p>
          <ul>
            <li><b>Suspension</b> : 14 jours au plus, avec une date de fin fixée par Katana. Elle porte sur tout le matricule. Le joueur reste membre, mais ses comptes sont inactifs et ses matchs de la période ne comptent pas.</li>
            <li><b>Exclusion</b> : définitive. Le matricule est conservé et n’est jamais réutilisé.</li>
            <li><b>Pendant une sanction</b> : le joueur lit les annonces et peut contester. Il ne fait aucune demande et n’envoie aucune capture.</li>
            <li><b>Recours</b> : la sanction s’applique dès la décision, et le joueur reçoit le motif. Il peut contester <b>dans les 48 heures</b>, dans « Mon compte ». Passé ce délai, la décision est définitive. Si la contestation aboutit, la sanction est levée et les matchs concernés sont recomptés.</li>
            <li><b>Captures écartées</b> : supprimées à la fin du délai de recours s’il y a une sanction, tout de suite sinon. Le registre et la synthèse du dossier sont conservés.</li>
            <li><b>Aucune sanction n’est publiée</b> : ni nom, ni motif, ni catégorie.</li>
            <li>Une anomalie statistique n’est jamais une preuve à elle seule : elle entraîne une vérification humaine, jamais une sanction automatique.</li>
          </ul>
        </article>

        <article class="chap" id="r-conf">
          <h2><span class="cn">12</span>Confidentialité</h2>
          <ul>
            <li>Publics : nom de gamer, pseudos, matricule et statistiques des classements.</li>
            <li>Privés : identité, e-mail, date de naissance, UID (visible uniquement par l’organisation et le joueur concerné) et historique des comptes.</li>
            <li>Ne publiez jamais les informations personnelles ou l’UID d’un autre joueur. Pour toute question ou contestation, utilisez le canal privé indiqué par l’organisation.</li>
            <li><b>Litiges</b> : les discussions, témoignages, captures et échanges avec Katana sont confidentiels. Seuls Katana et les personnes convoquées y ont accès. Il est interdit de les divulguer, de les copier ou de les publier, sur quelque support que ce soit. Une personne convoquée peut dire qu’elle a été convoquée et parler de ce qui la concerne directement, sans reprendre les témoignages ni les captures des autres. Les décisions publiées ne sont pas concernées.<span class="chg">Nouveau</span></li>
          </ul>
        </article>

        <article class="chap" id="r-chg">
          <h2>Ce qui change par rapport au guide PDF</h2>
          <ul>
            <li>Taille minimale d’un match : 16 participants (la mention « 20 participants maximum » était une erreur).</li>
            <li>Au moins 50 % de membres confirmés par match, arrondi vers le bas.</li>
            <li>Matchs libres : déclaration au moins 2 h avant, un match par créneau, capture sous 10 minutes (heure d’envoi) ; fermés jusqu’au lancement.</li>
            <li>Égalité parfaite : co-lauréats, titre partagé, lot non attribué.</li>
            <li>Fin de saison : pas de gel ; 48 h de vérification, puis classement final le dimanche qui suit.</li>
            <li>Comptes : 2 comptes enregistrés au maximum, un seul actif, 7 jours entre deux changements. Changement de pseudo par simple déclaration.</li>
            <li>Langue : comprendre le malgache est essentiel ; le parler est une information non bloquante.</li>
            <li>Statuts : suspension, retrait, réintégration et périodes de comptabilisation.</li>
            <li>Classement provisoire tous les 14 jours, le dimanche, avec coupure le samedi à 16 h selon l’heure d’envoi de la capture.</li>
            <li>Matchs en attente et litiges : dossier dans le site, convocations, décision sous 48 h, confidentialité.</li>
            <li>Sanctions : tableau-guide, recours de 48 h, aucune sanction publiée.</li>
            <li>Matchs de Katana : calendrier automatique le mercredi et le samedi à 16 h 05, rotation fixe des 6 cartes, report si la carte manque, date annulable. Code et mot de passe de la salle réservés aux membres actifs non suspendus. Pour tous les matchs : heure de fin au plus 1 h après le début annoncé, joueurs partis comptés dans l’effectif, jamais plus d’un joueur d’écart.</li>
            <li>Phase de démarrage : seuls les matchs de Katana comptent avant le lancement.</li>
          </ul>
        </article>
      </div>
    </div>
  </div>
</section>

<!-- ============ PROCESSUS ============ -->
<section class="view" data-view="processus" hidden>
  <div class="band">
    <div class="wrap">
      <div class="sec-head"><h1>Processus</h1><p>Chaque étape, dans l’ordre, pour savoir qui fait quoi et à quel moment.</p></div>
      <div class="flows">
        <div class="flow">
          <h3>Inscription</h3><p>De la demande au matricule.</p>
          <ol class="rail">
            <li><b>Formulaire</b><span>Page Inscription du site, avec la capture du profil (pseudo et UID visibles).</span></li>
            <li><b>Contrôles</b><span>UID et e-mail vérifiés automatiquement à l’envoi, puis par l’organisation : dossier complet, UID unique, pseudo vérifié sur la capture, code Messenger reçu par la <a href="https://www.facebook.com/profile.php?id=61596920126729" target="_blank" rel="noopener">page DFMM</a> depuis le compte Facebook indiqué, critères d’éligibilité.</span></li>
            <li><b>Décision</b><span>Approbation, demande de précisions ou refus motivé.</span></li>
            <li><b>Matricule DFMM-n</b><span>Compte enregistré, période active ouverte, message de confirmation.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Match de Katana</h3><p>Chaque mercredi et samedi, début à 16 h 05.</p>
          <ol class="rail">
            <li><b>Calendrier</b><span>Date, heure et carte de la rotation dans « Prochains événements », avec « Je participe ».</span></li>
            <li><b>Salle personnalisée</b><span>Créée vers 15 h 50. Code et mot de passe dans « Prochains événements », pour les membres actifs non suspendus. Consignes de salon rappelées, sans nombre maximum.</span></li>
            <li><b>Match</b><span>Victory Unite, chat écrit uniquement. Carte manquante : match reporté au jour de match suivant, avec la même carte.</span></li>
            <li><b>Capture du résultat</b><span>Prise par l’organisation, deux captures au-delà de 8 joueurs par faction.</span></li>
            <li><b>Saisie et contrôles</b><span>Lecture de la capture, rattachement des pseudos, contrôles automatiques ; fin au plus 1 h après le début, joueurs partis comptés.</span></li>
            <li><b>Validation</b><span>Validé avant la publication, il compte dans le classement du dimanche.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Match libre</h3><p>Organisé par les joueurs, déclaré au moins 2 h avant (ouvert au lancement).</p>
          <ol class="rail">
            <li><b>Déclaration</b><span>Date et heure de début, responsables HAAVK et GTI, motif facultatif.</span></li>
            <li><b>Enregistrement</b><span>Automatique ; Katana est averti et peut annuler.</span></li>
            <li><b>Salle</b><span>Carte au choix parmi toutes les cartes disponibles dans le mode ; code et mot de passe saisis par l’organisateur dans « Prochains événements ».</span></li>
            <li><b>Match dans le créneau</b><span>Fin au plus 1 h après l’heure de début, au moins 16 joueurs, factions équilibrées à un joueur près.</span></li>
            <li><b>Captures sous 10 minutes</b><span>Envoyées par le site : une par responsable, une par l’organisateur s’il n’est pas responsable.</span></li>
            <li><b>Contrôles et validation</b><span>Un seul match comptabilisé par créneau.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Validation d’un match</h3><p>Rien ne compte sans vérification humaine.</p>
          <ol class="rail">
            <li><b>Lecture</b><span>Carte, heure de fin, pseudos et 8 statistiques par joueur.</span></li>
            <li><b>Rattachement</b><span>Pseudo reconnu, à identifier, ou joueur non inscrit.</span></li>
            <li><b>Contrôles automatiques</b><span>16 participants, écart d’un joueur, 50 % de membres confirmés, heure de fin au plus 1 h après le début, valeurs manquantes, négatives ou en double.</span></li>
            <li><b>Décision</b><span>Validé : il compte. Invalidé : il est retiré pour tous.</span></li>
            <li class="stop"><b>Alerte de performance</b><span>Vérification humaine, jamais de sanction automatique.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Classements</h3><p>Tous les 14 jours, puis en fin de saison.</p>
          <ol class="rail">
            <li><b>Coupure</b><span>Samedi 16 h, selon l’heure d’envoi de la capture.</span></li>
            <li><b>Calcul</b><span>Totaux, moyennes, seuil médian, premier quartile et départages.</span></li>
            <li><b>Publication</b><span>Dimanche, classement provisoire numéroté.</span></li>
            <li><b>Réclamations</b><span>En privé, dans les 48 heures.</span></li>
            <li><b>Fin de saison</b><span>48 h de vérification, puis classement final le dimanche qui suit, titres et lots.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Comptes et pseudo</h3><p>Toujours tracés dans l’historique.</p>
          <ol class="rail">
            <li><b>Changement de pseudo</b><span>Simple déclaration, avant la participation suivante.</span></li>
            <li><b>Ajout d’un 2e compte</b><span>Pseudo, UID, capture et motif, puis décision. Activation immédiate possible.</span></li>
            <li><b>Changement de compte actif</b><span>Motif court, au moins 7 jours entre deux changements.</span></li>
            <li><b>Compte perdu</b><span>Remplacé définitivement, les statistiques restent au matricule.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Retrait et réintégration</h3><p>Le matricule n’est jamais perdu.</p>
          <ol class="rail">
            <li><b>Demande de retrait</b><span>Motif facultatif, rappel des conséquences avant l’envoi.</span></li>
            <li><b>Retrait</b><span>Automatique (sauf litige, match en attente ou sanction) : période fermée, comptes inactifs, demandes en cours annulées.</span></li>
            <li><b>Pendant le retrait</b><span>Absent des classements et des lots, historique conservé.</span></li>
            <li><b>Réintégration</b><span>Même matricule, nouvelle période à la date d’accord.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Match en attente et litige</h3><p>Tranché par Katana sous 48 h, dans le site.</p>
          <ol class="rail">
            <li><b>Mise en attente</b><span>Captures différentes, heure hors de la plage, ou décision de Katana.</span></li>
            <li><b>Dossier ouvert</b><span>Automatiquement, dans le site, à trancher sous 48 h.</span></li>
            <li><b>Convocations</b><span>Responsables, organisateur, témoins ; confirmation de réception sous 12 h.</span></li>
            <li><b>Discussion</b><span>Dans le site seulement, confidentielle.</span></li>
            <li><b>Décision</b><span>Vraie capture retenue, match refusé ou annulé ; la discussion se ferme.</span></li>
            <li><b>Synthèse</b><span>Validée par Katana, puis archivée ; les captures écartées sont supprimées.</span></li>
          </ol>
        </div>
        <div class="flow">
          <h3>Sanction et recours</h3><p>Proportionnée, motivée, contestable.</p>
          <ol class="rail">
            <li><b>Signalement ou alerte</b><span>Examen des éléments disponibles.</span></li>
            <li><b>Explication</b><span>Le joueur présente sa version des faits.</span></li>
            <li><b>Décision motivée</b><span>Avertissement, retrait de statistiques, suspension (14 jours au plus) ou exclusion, appliquée tout de suite ; jamais publiée.</span></li>
            <li><b>Recours sous 48 h</b><span>Bouton « Contester » dans Mon compte.</span></li>
            <li><b>Réponse de Katana</b><span>Décision maintenue, ou levée avec les matchs recomptés.</span></li>
          </ol>
        </div>
      </div>
    </div>
  </div>
</section>

const capCache = {};

async function attendreClaude() {

function norm(sn) {
  if (!sn) return [];
  let arr = Array.isArray(sn) ? sn : (sn.docs || sn.items || sn.results || null);
  if (!arr && typeof sn.forEach === 'function') { arr = []; sn.forEach(d => arr.push(d)); }
  return (arr || []).map(d => {
    let data = typeof d.data === 'function' ? d.data() : (d.data && typeof d.data === 'object' ? d.data : d);
    data = data || {};
    const id = d.id != null ? d.id : (data.id != null ? data.id : (d.ref && d.ref.id));
    return Object.assign({}, data, { id: String(id) });
  });
}
function abonner(col) {
  let fini = false;
  const t = setTimeout(() => { if (!fini) { ETAT.erreur[col] = 'délai dépassé'; planifier(); } }, 10000);
  try {
    CAP.db.collection(col).onSnapshot(sn => { fini = true; clearTimeout(t); ETAT.charge[col] = true; delete ETAT.erreur[col]; S[col] = norm(sn); planifier(); },
      er => { fini = true; clearTimeout(t); ETAT.erreur[col] = (er && er.message) || 'accès refusé'; planifier(); });
  } catch (e) { fini = true; clearTimeout(t); ETAT.erreur[col] = e.message; }
}
function local(col, id, d) { const i = S[col].findIndex(x => x.id === id); const r = Object.assign({}, d, { id }); if (i >= 0) S[col][i] = r; else S[col].push(r); }
async function ecrire(col, id, obj) {

}

/* ---------------- Brouillons des formulaires ----------------
   Une zone marquée data-brouillon="nom" garde ce qui y est tapé sur cet appareil (localStorage),
   pour ne pas tout ressaisir après avoir quitté la page. Jamais les mots de passe ni les fichiers.
   Effacé à l'envoi réussi, à la déconnexion, par le bouton « Effacer mes réponses », ou après BROUILLON_JOURS jours. */

    else if (el.id) val[el.id] = el.value;

function reduireImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error('conversion impossible')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image illisible')); };
    img.src = url;
  });
}

function champParam(p) {
  const id = 'p-' + p.cle, x = p.valeur;
  if (p.type === 'booleen') return '<select id="' + id + '"><option value="true"' + (x === true ? ' selected' : '') + '>Oui</option><option value="false"' + (x === false ? ' selected' : '') + '>Non</option></select>';
  if (p.type === 'jour') return '<select id="' + id + '">' + JOURS.map((j, i) => '<option value="' + i + '"' + (x === i ? ' selected' : '') + '>' + j + '</option>').join('') + '</select>';
  if (p.type === 'heure') return '<input type="time" id="' + id + '" value="' + esc(x) + '">';
  if (p.type === 'texte') return '<input type="text" id="' + id + '" value="' + esc(x) + '">';
  return '<input type="number" id="' + id + '" min="0" step="' + (p.type === 'decimal' ? '0.1' : '1') + '" inputmode="decimal" value="' + esc(x) + '">';
}
function lireParam(p) {
  const x = $('#p-' + p.cle).value;
  if (p.type === 'booleen') return x === 'true';
  if (p.type === 'jour') return Number(x);
  if (p.type === 'heure' || p.type === 'texte') return x;
  const n = Number(String(x).replace(',', '.'));
  return x === '' || isNaN(n) ? null : n;
}

async function enregistrerParam(cle) {

async function telechargerSauvegarde(b) {
  const etat = $('#sv-etat'); b.disabled = true;
  const out = { format: 'DFMM-LEAGUE-UV', version: 2, exporte_le: new Date().toISOString(), tables: {} };
  try {
    for (const t of TABLES_SAUVEGARDE) {
      etat.textContent = 'Lecture : ' + t + '…';
      let rows = [], de = 0;
      for (;;) {
        const { data, error } = await SB.from(t).select('*').range(de, de + 999);
        if (error) throw new Error(t + ' : ' + error.message);
        rows = rows.concat(data || []);
        if (!data || data.length < 1000) break;
        de += 1000;
      }
      out.tables[t] = rows;
    }
    const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'DFMM_LeagueUV_sauvegarde_' + now().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    const { error } = await SB.from('journal').insert({ type: 'Sauvegarde', decision: 'Sauvegarde complète téléchargée' });
    etat.textContent = error ? 'Fichier téléchargé, mais la date n’a pas pu être notée : ' + error.message : 'Sauvegarde téléchargée.';
    await chargerCompteursAdmin(); TAB.sauvegarde.charger();
    redessinerOnglets();
  } catch (x) { etat.textContent = 'Échec : ' + x.message; }
  finally { b.disabled = false; }
}

/* Contexte des règles : membres, comptes et matchs de la saison, en heure de Madagascar */
async function chargerContexte(saisonId) {
  const [a, b, c, sx, cr] = await Promise.all([
    SB.from('membres').select('id, matricule, nom_gamer, statut, periodes(debut, fin)').not('matricule', 'is', null),
    SB.from('comptes_jeu').select('id, membre_id, uid, pseudo, statut, comptes_periodes(debut, fin), pseudos_historique(pseudo, debut, fin)'),
    saisonId ? SB.from('matchs').select('id, saison_id, type, demarrage, carte, mode, fin, debut_annonce, jour_id, statut, motif, notes, valide_le, attente_decide_le, creneau_id, match_lignes(*), captures(id, envoyee_le, statut, exception)').eq('saison_id', saisonId) : Promise.resolve({ data: [] }),
    SB.from('sanctions').select('membre_id, type, debut, fin, statut, match_id').in('type', ['suspension', 'retrait_statistiques']),
    saisonId ? SB.from('creneaux').select('id, debut, statut').eq('saison_id', saisonId) : Promise.resolve({ data: [] })
  ]);
  const err = a.error || b.error || c.error; if (err) throw new Error(err.message);
  const per = l => (l || []).map(p => ({ debut: isoLoc(p.debut), fin: p.fin ? isoLoc(p.fin) : '' }));
  const membres = {}, parId = {}, comptes = {};
  (a.data || []).forEach(m => { const mat = matTxt(m.matricule); parId[m.id] = mat; membres[mat] = { matricule: mat, id: m.id, nom_gamer: m.nom_gamer, statut: STATUTS_MB[m.statut] || m.statut, periodes: per(m.periodes), suspensions: [] }; });
  (b.data || []).forEach(x => { if (!parId[x.membre_id]) return; comptes[String(x.id)] = { id: String(x.id), matricule: parId[x.membre_id], uid: x.uid, pseudo: x.pseudo, statut: x.statut, periodes: per(x.comptes_periodes), pseudos: (x.pseudos_historique || []).map(p => ({ pseudo: p.pseudo, debut: isoLoc(p.debut), fin: p.fin ? isoLoc(p.fin) : '' })) }; });
  CX = { membres, comptes, parId, comptesList: Object.values(comptes), creneaux: {}, matchsList: [] };
  // Sanctions (lot 4A) : suspensions (matchs de la période non comptés) et statistiques retirées dans un match.
  const sanc = (sx && !sx.error && sx.data) || [];
  sanc.filter(x => x.type === 'suspension' && CX.parId[x.membre_id]).forEach(x => { CX.membres[CX.parId[x.membre_id]].suspensions.push({ debut: isoLoc(x.debut), fin: isoLoc(x.fin), annulee: x.statut === 'levee' }); });
  // Créneaux des matchs libres (lot 3B) : plage de l'heure de fin et un seul match par créneau.
  ((cr && !cr.error && cr.data) || []).forEach(x => { const d = isoLoc(x.debut); CX.creneaux[x.id] = { id: x.id, date: d.slice(0, 10), debut: d.slice(11, 16), statut: ST_CR[x.statut] || x.statut }; });
  CX.matchsList = (c.data || []).map(matchJS);
  const retraits = sanc.filter(x => x.type === 'retrait_statistiques' && x.statut === 'active');
  CX.matchsList.forEach(m => m.lignes.forEach(l => { if (retraits.some(x => x.match_id === m.dbid && CX.parId[x.membre_id] === l.mat)) l.exclue_sanction = true; }));
  return CX;
}
function ligneJS(l) {
  const o = { id: l.id, faction: l.faction || '', pseudo: l.pseudo || '', cpt: l.compte_id ? String(l.compte_id) : '', mat: l.membre_id ? (CX.parId[l.membre_id] || '') : '', res: RES_DB[l.resolution] || 'non inscrit', identifie_le: isoLoc(l.identifie_le) };
  L.STATS.forEach(s => { o[s.k] = l[s.k] == null ? '' : Number(l[s.k]); });
  return o;
}
// Heure d'envoi contrôlée : la première capture valable sans retard accepté ; si toutes ont un retard accepté
// par Katana (échec technique prouvé), le délai ne bloque plus.
const capValable = x => x.statut !== 'refusee' && x.statut !== 'ecartee' && x.statut !== 'annulee';
function envoiDepuis(caps) {
  const ok = (caps || []).filter(capValable), sans = ok.filter(x => !x.exception).map(x => x.envoyee_le).sort();
  return { envoi: sans.length ? isoLoc(sans[0]) : '', delai_exception: !!ok.length && !sans.length };
}
function matchJS(m) {
  const e = envoiDepuis(m.captures);
  return { id: 'M-' + m.id, dbid: m.id, saison_id: m.saison_id, type: m.type === 'libre' ? 'Libre' : 'Katana', creneau_id: m.creneau_id || null, demarrage: !!m.demarrage, carte: m.carte || '', mode: m.mode || '', notes: m.notes || '',
    fin: isoLoc(m.fin), debut_annonce: isoLoc(m.debut_annonce), jour_id: m.jour_id || null, envoi: e.envoi, delai_exception: e.delai_exception, statut: ST_MATCH[m.statut] || m.statut, statut_db: m.statut, motif: m.motif || '', valide_le: isoLoc(m.valide_le), attente_decide_le: isoLoc(m.attente_decide_le),
    captures: (m.captures || []).filter(capValable).map(x => x.id),
    lignes: (m.match_lignes || []).slice().sort((x, y) => x.rang - y.rang).map(ligneJS) };
}

const PROMPT_CLAUDE = 'Tu lis une ou plusieurs captures d’écran du tableau de fin de match de Delta Force Mobile, avec les factions HAAVK et GTI.\nExtrais :\n- "carte" : le nom de la carte affiché dans l’en-tête, ou null ;\n- "mode" : le mode affiché, ou null ;\n- "fin" : la date et l’heure de fin affichées, au format AAAA-MM-JJTHH:MM, ou null si elles ne sont pas visibles ;\n- "vainqueur" : "HAAVK" ou "GTI" selon la faction indiquée gagnante (victoire), ou null si ce n’est pas visible ;\n- "lisible" : false si une partie de la capture est floue, coupée ou illisible, sinon true ;\n- "effectif" : le nombre de lignes de chaque tableau, d’après les numéros affichés à gauche (1, 2, 3…), sous la forme {"HAAVK": n, "GTI": n}, en comptant aussi les joueurs grisés (sur deux captures, le plus grand numéro de chaque tableau) ;\n- "lignes" : un objet par ligne numérotée de chaque tableau, SANS EN SAUTER AUCUNE : les joueurs grisés (partis pendant le match) comptent aussi, et un pseudo fait de points, de symboles ou d’écriture étrangère (par exemple « · · · · · · ˎ ») est un vrai pseudo à recopier tel quel. Chaque objet a "faction" ("HAAVK" ou "GTI", selon le côté du tableau où il apparaît), "pseudo" (recopié exactement, caractère par caractère : majuscules, chiffres, symboles et tags de clan comme ¬ ou 么), puis les 8 colonnes chiffrées dans l’ordre de gauche à droite : "score", "elim" (éliminations), "morts", "assist" (assistances), "med" (contribution médicale), "ing" (contribution ingénieur), "obj" (contribution aux objectifs), "tac" (contribution tactique).\nAjoute "parti": true pour un joueur grisé, sinon false.\nRègles : n’invente rien ; si une valeur est illisible, mets null, et si le pseudo est vraiment illisible, mets "pseudo": null mais garde la ligne. Vérifie avant de répondre que le nombre de lignes de chaque faction est égal à "effectif". Ignore les médailles et les badges. Si deux captures montrent le même joueur (haut et bas du tableau), ne le répète pas.\nRéponds uniquement avec un objet JSON de la forme {"carte":…,"mode":…,"fin":…,"vainqueur":…,"lisible":…,"effectif":{"HAAVK":…,"GTI":…},"lignes":[…]}, sans aucun texte autour.';
